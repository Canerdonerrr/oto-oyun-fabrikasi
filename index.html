<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeonArcade Hub - 2. Outer Wilds Engine</title>
    <style>
        :root {
            --bg-color: #030408;
            --panel-bg: rgba(10, 12, 22, 0.98);
            --pure-cyan: #00f0ff;
            --pure-pink: #ff007f;
            --pure-yellow: #ffe600;
            --text-main: #ffffff;
            --border-glow: rgba(255, 230, 0, 0.4);
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 4px;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto 4px auto;
            padding: 6px 12px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
        }

        h1 {
            font-size: 0.75rem;
            color: var(--pure-yellow);
            margin: 0;
            letter-spacing: 1px;
        }

        .menu-btn-top {
            background: rgba(255, 230, 0, 0.1);
            color: var(--pure-yellow);
            border: 1px solid var(--pure-yellow);
            padding: 4px 8px;
            font-size: 0.65rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            max-width: 800px;
            margin: 0 auto;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #gameCanvas {
            background: #020206;
            border: 1px solid rgba(255, 230, 0, 0.5);
            border-radius: 6px;
            display: block;
            box-shadow: 0 0 20px rgba(255, 230, 0, 0.15);
            width: 100%;
            max-width: 760px;
            height: 440px;
            touch-action: none;
        }

        .mobile-controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
            width: 100%;
            max-width: 760px;
            padding: 0 2px;
        }

        .ctrl-btn {
            background: rgba(255, 230, 0, 0.08);
            color: var(--pure-yellow);
            border: 1px solid rgba(255, 230, 0, 0.4);
            padding: 12px;
            font-size: 0.72rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: background 0.1s;
        }

        .ctrl-btn:active {
            background: var(--pure-yellow);
            color: #000;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(3, 4, 8, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 6px;
        }

        .overlay.hidden { display: none; }
        .overlay h2 { font-size: 1.2rem; margin-bottom: 6px; color: var(--pure-yellow); }
        .overlay p { font-size: 0.7rem; color: #b8c0d8; margin-bottom: 12px; padding: 0 15px; line-height: 1.3; }

        .btn {
            background: linear-gradient(135deg, var(--pure-yellow), #ff9900);
            color: #000000;
            border: 1px solid #ffffff;
            padding: 8px 18px;
            font-size: 0.75rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>⚡ 2. OUTER WILDS : TIMELOOP ENGINE ⚡</h1>
        <button class="menu-btn-top" onclick="resetGame()">🔄 DÖNGÜYÜ BAŞLAT</button>
    </div>

    <div class="main-layout">
        <div class="canvas-container">
            <canvas id="gameCanvas" width="760" height="440"></canvas>
            
            <div id="menuOverlay" class="overlay">
                <h2>2. OUTER WILDS (Timber Hearth)</h2>
                <p>Güneş 22 dakika sonra süpernova patlayacak. Bilgiyi yanına alarak zaman döngüsünde yeniden doğuyorsun. Android dokunmatik butonlarla keşif yap.</p>
                <button class="btn" id="startBtn">KEŞFE BAŞLA</button>
            </div>
        </div>

        <!-- Android Dokunmatik Kontrol Paneli -->
        <div class="mobile-controls">
            <button class="ctrl-btn" onclick="makeChoice(1)">🔸 [1] Nomai Harabelerini Tara (Bilgi +1, Süre -3dk)</button>
            <button class="ctrl-btn" onclick="makeChoice(2)">🔸 [2] Kuantum Ayı Sinyalini Dinle (Frekans +1)</button>
            <button class="ctrl-btn" onclick="makeChoice(3)">🔸 [3] Kamp Ateşinde Marshmallow Kızart (Can +1)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const menuOverlay = document.getElementById("menuOverlay");
        const startBtn = document.getElementById("startBtn");

        let score = 0;
        let timeRemaining = 22; // Dakika cinsinden döngü sayacı
        let knowledgeCount = 0;
        let frequency = 1;
        let statusText = "Güneş sistemi sakin görünüyor. Güneş henüz patlamadı.";

        function resetGame() {
            score = 0;
            timeRemaining = 22;
            knowledgeCount = 0;
            frequency = 1;
            statusText = "Yeni döngü başladı. Hatıraların seninle birlikte kaldı.";
            menuOverlay.classList.remove("hidden");
        }

        function makeChoice(type) {
            menuOverlay.classList.add("hidden");
            if (type === 1) {
                knowledgeCount += 1;
                timeRemaining = Math.max(0, timeRemaining - 3);
                score += 35;
                statusText = "Nomai yazıtlarını çözdün: Göz'ün koordinatları netleşiyor!";
            } else if (type === 2) {
                frequency += 1;
                timeRemaining = Math.max(0, timeRemaining - 2);
                score += 25;
                statusText = "Kuantum dalga boyu yakalandı. Ay konum değiştirdi.";
            } else if (type === 3) {
                timeRemaining = Math.max(0, timeRemaining - 1);
                score += 15;
                statusText = "Kamp ateşinin çıtırtısı ruhunu dinlendirdi. Hatıralar taze.";
            }

            if (timeRemaining <= 0) {
                statusText = "SÜPERNOVA PATLADI! Döngü Başa Sarıyor...";
                setTimeout(() => {
                    timeRemaining = 22;
                    statusText = "Heykel gözlerini açtı. Yeni bir döngüdesin dedektif.";
                }, 2000);
            }
        }

        startBtn.onclick = () => {
            menuOverlay.classList.add("hidden");
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Uzay Arka Plan Noktaları (Yıldızlar)
            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            ctx.fillRect(50, 40, 3, 3);
            ctx.fillRect(200, 100, 2, 2);
            ctx.fillRect(450, 70, 4, 4);
            ctx.fillRect(680, 150, 2, 2);
            ctx.fillRect(300, 380, 3, 3);

            // Üst İstatistik Kutusu
            ctx.fillStyle = "#ffe600";
            ctx.font = "bold 12px 'Courier New'";
            ctx.textAlign = "left";
            ctx.fillText(`KALAN SÜRE: ${timeRemaining} DK  |  BİLGİ: ${knowledgeCount}  |  FREKANS: ${frequency}`, 15, 25);
            ctx.textAlign = "right";
            ctx.fillText(`SKOR: ${score}`, canvas.width - 15, 25);

            // Ana Konsol Çerçevesi
            ctx.fillStyle = "#0d111c";
            ctx.fillRect(40, 50, canvas.width - 80, 280);
            ctx.strokeStyle = "#ffe600";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(40, 50, canvas.width - 80, 280);

            // Başlık
            ctx.fillStyle = "#ffe600";
            ctx.font = "bold 12px 'Courier New'";
            ctx.textAlign = "center";
            ctx.fillText("--- GEMİ BİLGİSAYARI VE SİNYAL İZLEME ---", canvas.width / 2, 85);

            // Durum Metni
            ctx.fillStyle = "#d0d8e8";
            ctx.font = "13px 'Courier New'";
            
            let words = statusText.split(" ");
            let line = "";
            let y = 135;
            
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + " ";
                let metrics = ctx.measureText(testLine);
                if (metrics.width > canvas.width - 120 && n > 0) {
                    ctx.fillText(line, canvas.width / 2, y);
                    line = words[n] + " ";
                    y += 24;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, canvas.width / 2, y);

            // Alt Not
            ctx.fillStyle = "#00f0ff";
            ctx.font = "11px 'Courier New'";
            ctx.fillText("Dokunmatik butonları kullanarak evrenin sırlarını keşfet.", canvas.width / 2, 305);
        }

        function mainLoop() {
            draw();
            requestAnimationFrame(mainLoop);
        }

        mainLoop();
    </script>
</body>
</html>
