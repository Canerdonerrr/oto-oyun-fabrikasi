<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeonBounce - Professional Edition</title>
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --neon-cyan: #38bdf8;
            --neon-pink: #ec4899;
            --neon-purple: #a855f7;
            --neon-yellow: #facc15;
            --text-main: #f8fafc;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            text-align: center;
            margin: 0;
            padding: 5px;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        h1 {
            font-size: 1.4rem;
            text-shadow: 0 0 12px var(--neon-cyan);
            margin: 2px 0;
            letter-spacing: 2px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            max-width: 400px;
            margin: 0 auto 4px auto;
            padding: 6px 12px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .hud-item span { color: var(--neon-cyan); }
        .hud-item.lives span { color: var(--neon-pink); }
        .hud-item.high span { color: var(--neon-yellow); }

        .canvas-container {
            position: relative;
            display: inline-block;
            margin: 0 auto;
        }

        canvas {
            background: #020617;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.25);
            display: block;
            border-radius: 10px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 10px;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--neon-pink);
            color: var(--text-main);
        }

        .overlay p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .btn {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body>

    <h1>NEON BOUNCE</h1>
    <div class="hud">
        <div class="hud-item">SKOR: <span id="scoreVal">0</span></div>
        <div class="hud-item high">REKOR: <span id="highVal">0</span></div>
        <div class="hud-item lives">CAN: <span id="livesVal">3</span></div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="380" height="480"></canvas>
        
        <!-- Menü Ekranı -->
        <div id="menuOverlay" class="overlay">
            <h2>NEON BOUNCE</h2>
            <p>Tuğlaları kır, güçlendiricileri topla ve rekoru kır!</p>
            <button class="btn" id="startBtn">OYUNA BAŞLA</button>
        </div>

        <!-- Game Over Ekranı -->
        <div id="gameOverOverlay" class="overlay hidden">
            <h2>OYUN BİTTİ</h2>
            <p id="finalScoreText">Skorun: 0</p>
            <button class="btn" id="restartBtn">TEKRAR DENE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // UI Elementleri
        const scoreEl = document.getElementById("scoreVal");
        const highEl = document.getElementById("highVal");
        const livesEl = document.getElementById("livesVal");
        const menuOverlay = document.getElementById("menuOverlay");
        const gameOverOverlay = document.getElementById("gameOverOverlay");
        const finalScoreText = document.getElementById("finalScoreText");
        const startBtn = document.getElementById("startBtn");
        const restartBtn = document.getElementById("restartBtn");

        // Oyun Durumları
        let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
        let score = 0;
        let highScore = localStorage.getItem("neon_high_score") || 0;
        let lives = 3;
        highEl.innerText = highScore;

        // Screen Shake Değişkenleri
        let shakeDuration = 0;
        let shakeIntensity = 0;

        // Web Audio API Sentezleyici
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let now = audioCtx.currentTime;

                if (type === "hit") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === "brick") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === "powerup") {
                    osc.type = "square";
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === "gameover") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(60, now + 0.4);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch(e) {}
        }

        // Oyun Nesneleri
        let paddle = {
            x: canvas.width / 2 - 45,
            y: canvas.height - 30,
            width: 90,
            height: 12,
            dx: 0,
            color: "#ec4899",
            targetWidth: 90
        };

        let balls = [];
        let bricks = [];
        let particles = [];
        let powerUps = [];
        let backgroundStars = [];

        // Yıldız Arkaplanı Oluşturma
        for (let i = 0; i < 40; i++) {
            backgroundStars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.7 + 0.2
            });
        }

        function initLevel() {
            bricks = [];
            let rows = 4;
            let cols = 6;
            let brickWidth = 52;
            let brickHeight = 18;
            let padding = 10;
            let offsetTop = 45;
            let offsetLeft = 22;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let health = (r === 0 || r === 1) ? 2 : 1; // Üst sıra daha dayanıklı
                    let color = health === 2 ? "#a855f7" : "#38bdf8";
                    bricks.push({
                        x: offsetLeft + c * (brickWidth + padding),
                        y: offsetTop + r * (brickHeight + padding),
                        width: brickWidth,
                        height: brickHeight,
                        health: health,
                        maxHealth: health,
                        color: color
                    });
                }
            }
        }

        function resetBallAndPaddle() {
            paddle.width = 90;
            paddle.targetWidth = 90;
            paddle.x = canvas.width / 2 - paddle.width / 2;
            balls = [{
                x: canvas.width / 2,
                y: paddle.y - 15,
                radius: 8,
                speedX: 3 * (Math.random() > 0.5 ? 1 : -1),
                speedY: -4,
                color: "#38bdf8"
            }];
        }

        function startGame() {
            initAudio();
            score = 0;
            lives = 3;
            scoreEl.innerText = score;
            livesEl.innerText = lives;
            menuOverlay.classList.add("hidden");
            gameOverOverlay.classList.add("hidden");
            initLevel();
            resetBallAndPaddle();
            gameState = "PLAYING";
        }

        function triggerGameOver() {
            gameState = "GAMEOVER";
            playSound("gameover");
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("neon_high_score", highScore);
                highEl.innerText = highScore;
            }
            finalScoreText.innerText = "Toplam Skorun: " + score;
            gameOverOverlay.classList.remove("hidden");
        }

        // Kontroller (Mouse / Dokunmatik)
        function handlePointerMove(clientX) {
            let rect = canvas.getBoundingClientRect();
            let rootX = clientX - rect.left;
            paddle.x = rootX - paddle.width / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
        }

        canvas.addEventListener("mousemove", (e) => {
            if (gameState === "PLAYING") handlePointerMove(e.clientX);
        });
        canvas.addEventListener("touchmove", (e) => {
            if (gameState === "PLAYING") {
                handlePointerMove(e.touches[0].clientX);
                e.preventDefault();
            }
        }, { passive: false });

        startBtn.addEventListener("click", startGame);
        restartBtn.addEventListener("click", startGame);

        // Parçacık Efekti Üretici
        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 3 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    radius: Math.random() * 2 + 1,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        // Power-Up Düşürme
        function spawnPowerUp(x, y) {
            if (Math.random() < 0.35) { // %35 ihtimalle
                let types = ["wide", "multiball"];
                let type = types[Math.floor(Math.random() * types.length)];
                powerUps.push({
                    x: x,
                    y: y,
                    width: 22,
                    height: 12,
                    dy: 2,
                    type: type,
                    color: type === "wide" ? "#facc15" : "#ec4899"
                });
            }
        }

        function triggerScreenShake(intensity, duration) {
            shakeIntensity = intensity;
            shakeDuration = duration;
        }

        // Oyun Döngüsü Güncelleme
        function update() {
            if (gameState !== "PLAYING") return;

            // Çubuk genişliği yumuşak geçiş
            if (paddle.width !== paddle.targetWidth) {
                paddle.width += (paddle.targetWidth - paddle.width) * 0.1;
            }

            // Screen Shake Azaltma
            if (shakeDuration > 0) {
                shakeDuration--;
            }

            // Parçacık Güncelleme
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // Power-Up Güncelleme
            for (let i = powerUps.length - 1; i >= 0; i--) {
                let pu = powerUps[i];
                pu.y += pu.dy;

                // Çubukla çarpışma kontrolü
                if (
                    pu.y + pu.height >= paddle.y &&
                    pu.y <= paddle.y + paddle.height &&
                    pu.x + pu.width >= paddle.x &&
                    pu.x <= paddle.x + paddle.width
                ) {
                    playSound("powerup");
                    if (pu.type === "wide") {
                        paddle.targetWidth = 130;
                        setTimeout(() => { paddle.targetWidth = 90; }, 8000);
                    } else if (pu.type === "multiball" && balls.length > 0) {
                        let b = balls[0];
                        balls.push({
                            x: b.x,
                            y: b.y,
                            radius: 8,
                            speedX: -b.speedX,
                            speedY: b.speedY,
                            color: "#facc15"
                        });
                    }
                    powerUps.splice(i, 1);
                    continue;
                }

                // Ekran dışına çıkma
                if (pu.y > canvas.height) {
                    powerUps.splice(i, 1);
                }
            }

            // Topları Güncelleme
            for (let i = balls.length - 1; i >= 0; i--) {
                let ball = balls[i];
                ball.x += ball.speedX;
                ball.y += ball.speedY;

                // Sol / Sağ Duvar
                if (ball.x - ball.radius < 0) {
                    ball.x = ball.radius;
                    ball.speedX = -ball.speedX;
                    playSound("hit");
                }
                if (ball.x + ball.radius > canvas.width) {
                    ball.x = canvas.width - ball.radius;
                    ball.speedX = -ball.speedX;
                    playSound("hit");
                }

                // Tavan
                if (ball.y - ball.radius < 0) {
                    ball.y = ball.radius;
                    ball.speedY = -ball.speedY;
                    playSound("hit");
                }

                // Çubuk (Paddle) Çarpışması
                if (
                    ball.y + ball.radius >= paddle.y &&
                    ball.y - ball.radius <= paddle.y + paddle.height &&
                    ball.x >= paddle.x &&
                    ball.x <= paddle.x + paddle.width
                ) {
                    ball.speedY = -Math.abs(ball.speedY);
                    // Falsolu açı verme
                    let hitPoint = ball.x - (paddle.x + paddle.width / 2);
                    ball.speedX = hitPoint * 0.15;
                    playSound("hit");
                    createParticles(ball.x, paddle.y, paddle.color, 5);
                }

                // Tuğla Çarpışmaları
                for (let j = bricks.length - 1; j >= 0; j--) {
                    let b = bricks[j];
                    if (
                        ball.x + ball.radius > b.x &&
                        ball.x - ball.radius < b.x + b.width &&
                        ball.y + ball.radius > b.y &&
                        ball.y - ball.radius < b.y + b.height
                    ) {
                        ball.speedY = -ball.speedY;
                        b.health--;
                        playSound("brick");
                        createParticles(ball.x, ball.y, b.color, 6);

                        if (b.health <= 0) {
                            spawnPowerUp(b.x + b.width / 2, b.y + b.height / 2);
                            bricks.splice(j, 1);
                            score += 25;
                        } else {
                            score += 10;
                            b.color = "#38bdf8"; // Renk değişimi (hasar aldı)
                        }
                        scoreEl.innerText = score;
                        triggerScreenShake(3, 8);
                        break;
                    }
                }

                // Alt Taban (Top Kaybı)
                if (ball.y > canvas.height + ball.radius) {
                    balls.splice(i, 1);
                }
            }

            // Tüm toplar bittiyse can azalt
            if (balls.length === 0) {
                lives--;
                livesEl.innerText = lives;
                triggerScreenShake(6, 15);
                if (lives <= 0) {
                    triggerGameOver();
                } else {
                    resetBallAndPaddle();
                }
            }

            // Bölüm bittiyse yeni seviye yükle
            if (bricks.length === 0) {
                score += 150;
                initLevel();
                resetBallAndPaddle();
            }
        }

        // Çizim İşlemleri (Render)
        function draw() {
            ctx.save();

            // Screen Shake Uygulaması
            if (shakeDuration > 0) {
                let offsetX = (Math.random() - 0.5) * shakeIntensity;
                let offsetY = (Math.random() - 0.5) * shakeIntensity;
                ctx.translate(offsetX, offsetY);
            }

            // Arkaplan İz Efekti (Motion Blur)
            ctx.fillStyle = "rgba(2, 6, 23, 0.4)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Yıldızları Çiz
            backgroundStars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            if (gameState === "PLAYING" || gameState === "GAMEOVER") {
                // Tuğlaları Çiz
                bricks.forEach(b => {
                    ctx.save();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = b.color;
                    ctx.fillStyle = b.color;
                    ctx.fillRect(b.x, b.y, b.width, b.height);
                    ctx.restore();
                });

                // Power-Up'ları Çiz
                powerUps.forEach(pu => {
                    ctx.save();
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = pu.color;
                    ctx.fillStyle = pu.color;
                    ctx.beginPath();
                    ctx.roundRect(pu.x, pu.y, pu.width, pu.height, 4);
                    ctx.fill();
                    ctx.restore();
                });

                // Parçacıkları Çiz
                particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // Çubuğu Çiz
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = paddle.color;
                ctx.fillStyle = paddle.color;
                ctx.beginPath();
                ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
                ctx.fill();
                ctx.restore();

                // Topları Çiz
                balls.forEach(ball => {
                    ctx.save();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = ball.color;
                    ctx.fillStyle = ball.color;
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            }

            ctx.restore();
        }

        // Ana Oyun Döngüsü (60+ FPS)
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
