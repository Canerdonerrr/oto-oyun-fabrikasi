<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeonArcade Hub - 6 in 1 Pro Edition</title>
    <style>
        :root {
            --bg-color: #020205;
            --panel-bg: rgba(10, 10, 20, 0.92);
            --pure-cyan: #00f0ff;
            --pure-pink: #ff007f;
            --pure-yellow: #ffe600;
            --pure-green: #00ff66;
            --pure-purple: #9d00ff;
            --text-main: #ffffff;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 4px;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        h1 {
            font-size: 1rem;
            color: var(--pure-cyan);
            margin: 2px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .hud {
            display: flex;
            justify-content: space-between;
            max-width: 960px;
            margin: 0 auto 4px auto;
            padding: 5px 12px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        .hud-item { display: flex; align-items: center; gap: 4px; }
        .hud-item span { color: var(--pure-cyan); }
        .hud-item.lives span { color: var(--pure-pink); }
        .hud-item.high span { color: var(--pure-yellow); }
        .hud-item.level span { color: var(--pure-green); }
        .hud-item.combo span { color: var(--pure-purple); }

        .main-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 10px;
            max-width: 980px;
            margin: 0 auto;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
        }

        #gameCanvas {
            background: #05050c;
            border: 1px solid rgba(0, 240, 255, 0.6);
            border-radius: 6px;
            display: block;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            width: 680px;
            height: 900px;
            max-width: 72vw;
            max-height: 75vh;
        }

        /* Sağ Yan Oyun Seçim Paneli */
        .sidebar {
            width: 250px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
            max-height: 75vh;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 0.85rem;
            color: var(--pure-yellow);
            margin: 4px 0 6px 0;
            text-shadow: 0 0 8px rgba(255, 230, 0, 0.5);
        }

        .game-btn {
            background: rgba(15, 15, 30, 0.9);
            color: var(--text-main);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 8px 10px;
            font-size: 0.72rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .game-btn span { font-size: 0.6rem; color: #8888b0; }
        .game-btn:hover { border-color: var(--pure-cyan); background: rgba(0, 240, 255, 0.1); transform: translateX(2px); }
        .game-btn.active { border-color: var(--pure-pink); background: rgba(255, 0, 127, 0.15); color: var(--pure-pink); box-shadow: 0 0 10px rgba(255, 0, 127, 0.3); }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(2, 2, 5, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 6px;
        }

        .overlay.hidden { display: none; }

        .overlay h2 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: var(--pure-pink);
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.7);
        }

        .overlay p {
            font-size: 0.85rem;
            color: #b8b8d8;
            margin-bottom: 15px;
            padding: 0 15px;
            max-width: 450px;
            line-height: 1.4;
        }

        .btn {
            background: linear-gradient(135deg, var(--pure-cyan), #0077ff);
            color: #000000;
            border: 1px solid #ffffff;
            padding: 10px 24px;
            font-size: 0.9rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            transition: all 0.2s ease;
        }

        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 240, 255, 0.9); }
    </style>
</head>
<body>

    <h1>⚡ NEON ARCADE HUB : 6 IN 1 PRO ⚡</h1>
    <div class="hud">
        <div class="hud-item">⭐ SKOR: <span id="scoreVal">0</span></div>
        <div class="hud-item high">🏆 REKOR: <span id="highVal">0</span></div>
        <div class="hud-item combo" id="comboContainer">🔥 KOMBO: <span id="comboVal">x1</span></div>
        <div class="hud-item lives" id="livesContainer">🛡️ CAN: <span id="livesVal">3</span></div>
        <div class="hud-item level" id="levelContainer">📊 LVL: <span id="levelVal">1</span></div>
    </div>

    <div class="main-layout">
        <div class="canvas-container">
            <canvas id="gameCanvas" width="680" height="900"></canvas>
            
            <!-- Ana Menü -->
            <div id="menuOverlay" class="overlay">
                <h2 id="menuTitle">NEON BOUNCE 3D</h2>
                <p id="menuDesc">Standart dengeli hızda klasik neon tuğla kırıcısı. Sağdan diğer efsane oyunları seçebilirsin!</p>
                <button class="btn" id="startBtn">OYUNA BAŞLA</button>
            </div>

            <!-- Game Over -->
            <div id="gameOverOverlay" class="overlay hidden">
                <h2>OYUN BİTTİ</h2>
                <p id="finalScoreText">Skorun: 0</p>
                <button class="btn" id="restartBtn">TEKRAR DENE</button>
            </div>
        </div>

        <!-- Sağ Yan Oyun Seçim Paneli -->
        <div class="sidebar">
            <h3>🕹️ OYUN ARŞİVİ</h3>
            <button class="game-btn active" onclick="switchGame(0)">
                1. Neon Bounce
                <span>Klasik Tuğla Kırıcı</span>
            </button>
            <button class="game-btn" onclick="switchGame(1)">
                2. Cyber Snake X
                <span>Yılan & Neon Yem</span>
            </button>
            <button class="game-btn" onclick="switchGame(2)">
                3. Neon Invaders
                <span>Uzay Savunma Savaşçısı</span>
            </button>
            <button class="game-btn" onclick="switchGame(3)">
                4. Graviton Jump
                <span>Platform Zıplama Macerası</span>
            </button>
            <button class="game-btn" onclick="switchGame(4)">
                5. Pulse Pong
                <span>Retro Tenis Düellosu</span>
            </button>
            <button class="game-btn" onclick="switchGame(5)">
                6. Neon Asteroids
                <span>Asteroit İmha Operasyonu</span>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreEl = document.getElementById("scoreVal");
        const highEl = document.getElementById("highVal");
        const comboEl = document.getElementById("comboVal");
        const livesEl = document.getElementById("livesVal");
        const levelEl = document.getElementById("levelVal");
        const menuOverlay = document.getElementById("menuOverlay");
        const gameOverOverlay = document.getElementById("gameOverOverlay");
        const finalScoreText = document.getElementById("finalScoreText");
        const startBtn = document.getElementById("startBtn");
        const restartBtn = document.getElementById("restartBtn");
        const menuTitle = document.getElementById("menuTitle");
        const menuDesc = document.getElementById("menuDesc");
        const comboContainer = document.getElementById("comboContainer");
        const livesContainer = document.getElementById("livesContainer");
        const levelContainer = document.getElementById("levelContainer");

        let activeGameIndex = 0;
        let gameState = "MENU";
        let score = 0;
        let highScore = localStorage.getItem("neon_hub_high") || 0;
        highEl.innerText = highScore;

        let inputX = canvas.width / 2;
        let keys = {};

        // Ses Motoru
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playSound(freq, type = "sine", duration = 0.08) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // --- 1. NEON BOUNCE (Tuğla Kırıcı - Normal Standart Hız) ---
        let nb = {
            paddle: { x: 260, y: 840, w: 130, h: 16, color: "#ff007f" },
            ball: { x: 340, y: 810, r: 8, dx: 3.2, dy: -3.2, color: "#00f0ff" },
            bricks: [],
            lives: 3, level: 1, combo: 1, comboTimer: 0
        };

        function initNeonBounceLevel() {
            nb.bricks = [];
            let rows = 5; let cols = 8;
            let bw = 70; let bh = 22; let pad = 10;
            let offsetLeft = (canvas.width - (cols * (bw + pad) - pad)) / 2;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let isBoss = (r === 0 && Math.random() < 0.4);
                    nb.bricks.push({
                        x: offsetLeft + c * (bw + pad), y: 60 + r * (bh + pad), w: bw, h: bh,
                        status: 1, health: isBoss ? 2 : 1, isBoss: isBoss,
                        color: isBoss ? "#ffe600" : ["#ff007f", "#00f0ff", "#00ff66", "#9d00ff"][r % 4]
                    });
                }
            }
        }

        function resetNeonBounceBall() {
            nb.ball.x = nb.paddle.x + nb.paddle.w / 2;
            nb.ball.y = nb.paddle.y - 15;
            nb.ball.dx = 3.2 * (Math.random() > 0.5 ? 1 : -1);
            nb.ball.dy = -3.2;
        }

        // --- 2. CYBER SNAKE X ---
        let cs = {
            snake: [{x: 15, y: 15}, {x: 14, y: 15}, {x: 13, y: 15}],
            dir: {x: 1, y: 0}, nextDir: {x: 1, y: 0},
            food: {x: 5, y: 5, color: "#00ff66"},
            gridSize: 25, timer: 0, speed: 8
        };
        function spawnCSFood() {
            cs.food.x = Math.floor(Math.random() * (canvas.width / cs.gridSize));
            cs.food.y = Math.floor(Math.random() * (canvas.height / cs.gridSize));
        }

        // --- 3. NEON INVADERS ---
        let ni = {
            ship: {x: 310, y: 830, w: 50, h: 25, speed: 6},
            bullets: [], aliens: [], alienDir: 1, lives: 3
        };
        function initNeonInvaders() {
            ni.bullets = []; ni.aliens = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 8; c++) {
                    ni.aliens.push({x: 80 + c * 65, y: 80 + r * 50, w: 40, h: 25, status: 1, color: ["#ff007f", "#00f0ff", "#ffe600", "#00ff66"][r]});
                }
            }
        }

        // --- 4. GRAVITON JUMP ---
        let gj = {
            player: {x: 320, y: 700, w: 32, h: 32, vy: 0},
            platforms: [], score: 0, cameraY: 0
        };
        function initGravitonJump() {
            gj.platforms = [{x: 280, y: 820, w: 120, h: 16}];
            for (let i = 0; i < 8; i++) {
                gj.platforms.push({
                    x: Math.random() * (canvas.width - 120),
                    y: 700 - i * 110,
                    w: 100 - i * 4, h: 16
                });
            }
            gj.player.x = gj.platforms[0].x + 40;
            gj.player.y = gj.platforms[0].y - 40;
            gj.player.vy = -10;
        }

        // --- 5. PULSE PONG ---
        let pp = {
            p1: {x: 30, y: 390, w: 16, h: 100, score: 0},
            p2: {x: 634, y: 390, w: 16, h: 100, score: 0},
            ball: {x: 340, y: 450, r: 8, dx: 3.5, dy: 2.5}
        };

        // --- 6. NEON ASTEROIDS ---
        let na = {
            ship: {x: 340, y: 450, angle: 0, speed: 0},
            bullets: [], asteroids: [], lives: 3
        };
        function initNeonAsteroids() {
            na.bullets = []; na.asteroids = [];
            for (let i = 0; i < 5; i++) {
                na.asteroids.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    dx: (Math.random() - 0.5) * 3, dy: (Math.random() - 0.5) * 3, radius: 35
                });
            }
        }

        // Oyun Değiştirici
        function switchGame(index) {
            activeGameIndex = index;
            document.querySelectorAll(".sidebar .game-btn").forEach((btn, idx) => {
                btn.classList.toggle("active", idx === index);
            });

            let titles = ["NEON BOUNCE", "CYBER SNAKE X", "NEON INVADERS", "GRAVITON JUMP", "PULSE PONG", "NEON ASTEROIDS"];
            let descs = [
                "Standart dengeli hızda klasik neon tuğla kırıcısı.",
                "Yön tuşları veya fare ile neon yılanı yönlendir, yemleri topla.",
                "Uzay geminle neon istilacıları vurarak yok et.",
                "Yukarı doğru sürekli zıplayan neon karakteri yönet.",
                "Yapay zekaya karşı retro pong tenis maçı.",
                "Uzay boşluğunda asteroitleri lazerle imha et."
            ];

            menuTitle.innerText = titles[index];
            menuDesc.innerText = descs[index];

            // HUD Görünürlükleri
            comboContainer.style.display = (index === 0) ? "flex" : "none";
            livesContainer.style.display = (index === 0 || index === 2 || index === 5) ? "flex" : "none";
            levelContainer.style.display = (index === 0) ? "flex" : "none";

            menuOverlay.classList.remove("hidden");
            gameOverOverlay.classList.add("hidden");
            gameState = "MENU";
        }

        function startGame() {
            initAudio();
            score = 0;
            scoreEl.innerText = score;
            menuOverlay.classList.add("hidden");
            gameOverOverlay.classList.add("hidden");

            if (activeGameIndex === 0) {
                nb.lives = 3; nb.level = 1; nb.combo = 1;
                livesEl.innerText = nb.lives; levelEl.innerText = nb.level;
                initNeonBounceLevel(); resetNeonBounceBall();
            } else if (activeGameIndex === 1) {
                cs.snake = [{x: 15, y: 15}, {x: 14, y: 15}, {x: 13, y: 15}];
                cs.dir = {x: 1, y: 0}; cs.nextDir = {x: 1, y: 0};
                spawnCSFood();
            } else if (activeGameIndex === 2) {
                ni.lives = 3; livesEl.innerText = ni.lives;
                initNeonInvaders();
            } else if (activeGameIndex === 3) {
                initGravitonJump();
            } else if (activeGameIndex === 4) {
                pp.ball.x = canvas.width / 2; pp.ball.y = canvas.height / 2;
            } else if (activeGameIndex === 5) {
                na.lives = 3; livesEl.innerText = na.lives;
                initNeonAsteroids();
            }
            gameState = "PLAYING";
        }

        function triggerGameOver() {
            gameState = "GAMEOVER";
            playSound(120, "sawtooth", 0.3);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("neon_hub_high", highScore);
                highEl.innerText = highScore;
            }
            finalScoreText.innerText = "Toplam Skorun: " + score;
            gameOverOverlay.classList.remove("hidden");
        }

        // Kontroller
        window.addEventListener("mousemove", (e) => {
            let rect = canvas.getBoundingClientRect();
            inputX = (e.clientX - rect.left) * (canvas.width / rect.width);
            if (activeGameIndex === 0) {
                nb.paddle.x = inputX - nb.paddle.w / 2;
                if (nb.paddle.x < 0) nb.paddle.x = 0;
                if (nb.paddle.x + nb.paddle.w > canvas.width) nb.paddle.x = canvas.width - nb.paddle.w;
            } else if (activeGameIndex === 2) {
                ni.ship.x = inputX - ni.ship.w / 2;
            } else if (activeGameIndex === 3) {
                gj.player.x = inputX;
            } else if (activeGameIndex === 4) {
                pp.p1.y = inputX - pp.p1.h / 2;
            }
        });

        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (activeGameIndex === 1) {
                if (e.key === "ArrowUp" && cs.dir.y === 0) cs.nextDir = {x: 0, y: -1};
                if (e.key === "ArrowDown" && cs.dir.y === 0) cs.nextDir = {x: 0, y: 1};
                if (e.key === "ArrowLeft" && cs.dir.x === 0) cs.nextDir = {x: -1, y: 0};
                if (e.key === "ArrowRight" && cs.dir.x === 0) cs.nextDir = {x: 1, y: 0};
            } else if (activeGameIndex === 2 && e.key === " ") {
                ni.bullets.push({x: ni.ship.x + ni.ship.w / 2 - 3, y: ni.ship.y, w: 6, h: 14});
                playSound(600, "square", 0.05);
            } else if (activeGameIndex === 5 && e.key === " ") {
                na.bullets.push({x: na.ship.x, y: na.ship.y, dx: Math.cos(na.ship.angle) * 7, dy: Math.sin(na.ship.angle) * 7, life: 40});
                playSound(500, "triangle", 0.05);
            }
        });
        window.addEventListener("keyup", (e) => { keys[e.key] = false; });

        startBtn.addEventListener("click", startGame);
        restartBtn.addEventListener("click", startGame);

        // --- UPDATE LOOP ---
        let snakeCounter = 0;
        function update() {
            if (gameState !== "PLAYING") return;

            if (activeGameIndex === 0) {
                // Neon Bounce
                if (nb.combo > 1) {
                    nb.comboTimer--;
                    if (nb.comboTimer <= 0) { nb.combo = 1; comboEl.innerText = "x" + nb.combo; }
                }
                nb.ball.x += nb.ball.dx;
                nb.ball.y += nb.ball.dy;

                if (nb.ball.x - nb.ball.r < 0) { nb.ball.x = nb.ball.r; nb.ball.dx = -nb.ball.dx; playSound(300); }
                if (nb.ball.x + nb.ball.r > canvas.width) { nb.ball.x = canvas.width - nb.ball.r; nb.ball.dx = -nb.ball.dx; playSound(300); }
                if (nb.ball.y - nb.ball.r < 0) { nb.ball.y = nb.ball.r; nb.ball.dy = -nb.ball.dy; playSound(300); }

                if (
                    nb.ball.y + nb.ball.r >= nb.paddle.y &&
                    nb.ball.y - nb.ball.r <= nb.paddle.y + nb.paddle.h &&
                    nb.ball.x >= nb.paddle.x && nb.ball.x <= nb.paddle.x + nb.paddle.w
                ) {
                    nb.ball.dy = -Math.abs(nb.ball.dy);
                    let hit = nb.ball.x - (nb.paddle.x + nb.paddle.w / 2);
                    nb.ball.dx = hit * 0.12;
                    playSound(350);
                }

                if (nb.ball.y > canvas.height + 20) {
                    nb.lives--; livesEl.innerText = nb.lives;
                    nb.combo = 1; comboEl.innerText = "x" + nb.combo;
                    if (nb.lives <= 0) triggerGameOver();
                    else resetNeonBounceBall();
                }

                let activeB = 0;
                nb.bricks.forEach(b => {
                    if (b.status === 1) {
                        activeB++;
                        if (
                            nb.ball.x + nb.ball.r > b.x && nb.ball.x - nb.ball.r < b.x + b.w &&
                            nb.ball.y + nb.ball.r > b.y && nb.ball.y - nb.ball.r < b.y + b.h
                        ) {
                            nb.ball.dy = -nb.ball.dy;
                            b.health--;
                            if (b.health <= 0) {
                                b.status = 0;
                                nb.combo++; nb.comboTimer = 180; comboEl.innerText = "x" + nb.combo;
                                score += 25 * nb.combo; scoreEl.innerText = score;
                                playSound(500, "triangle", 0.08);
                            } else { playSound(200, "square", 0.08); }
                        }
                    }
                });
                if (activeB === 0) {
                    nb.level++; levelEl.innerText = nb.level;
                    initNeonBounceLevel(); resetNeonBounceBall();
                }

            } else if (activeGameIndex === 1) {
                // Cyber Snake X
                snakeCounter++;
                if (snakeCounter % 7 === 0) {
                    cs.dir = cs.nextDir;
                    let head = {x: cs.snake[0].x + cs.dir.x, y: cs.snake[0].y + cs.dir.y};
                    if (head.x < 0 || head.x >= canvas.width / cs.gridSize || head.y < 0 || head.y >= canvas.height / cs.gridSize) {
                        triggerGameOver(); return;
                    }
                    for (let s of cs.snake) { if (head.x === s.x && head.y === s.y) { triggerGameOver(); return; } }
                    cs.snake.unshift(head);
                    if (head.x === cs.food.x && head.y === cs.food.y) {
                        score += 50; scoreEl.innerText = score; playSound(700, "sine", 0.1); spawnCSFood();
                    } else { cs.snake.pop(); }
                }

            } else if (activeGameIndex === 2) {
                // Neon Invaders
                for (let i = ni.bullets.length - 1; i >= 0; i--) {
                    ni.bullets[i].y -= 8;
                    if (ni.bullets[i].y < 0) { ni.bullets.splice(i, 1); continue; }
                    let b = ni.bullets[i];
                    for (let a of ni.aliens) {
                        if (a.status === 1 && b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) {
                            a.status = 0; ni.bullets.splice(i, 1);
                            score += 40; scoreEl.innerText = score; playSound(600, "triangle", 0.08);
                            break;
                        }
                    }
                }
                let allDead = true;
                ni.aliens.forEach(a => { if (a.status === 1) allDead = false; });
                if (allDead) initNeonInvaders();

            } else if (activeGameIndex === 3) {
                // Graviton Jump
                gj.player.vy += 0.35;
                gj.player.y += gj.player.vy;
                gj.platforms.forEach(p => {
                    if (
                        gj.player.vy > 0 &&
                        gj.player.x + gj.player.w > p.x && gj.player.x < p.x + p.w &&
                        gj.player.y + gj.player.h >= p.y && gj.player.y + gj.player.h <= p.y + 16
                    ) {
                        gj.player.vy = -11; playSound(450, "sine", 0.05);
                    }
                });
                if (gj.player.y < 400) {
                    let diff = 400 - gj.player.y;
                    gj.player.y = 400;
                    gj.platforms.forEach(p => {
                        p.y += diff;
                        if (p.y > canvas.height) {
                            p.y = 0; p.x = Math.random() * (canvas.width - 110);
                            score += 15; scoreEl.innerText = score;
                        }
                    });
                }
                if (gj.player.y > canvas.height) triggerGameOver();

            } else if (activeGameIndex === 4) {
                // Pulse Pong
                pp.ball.x += pp.ball.dx; pp.ball.y += pp.ball.dy;
                if (pp.ball.y - pp.ball.r < 0 || pp.ball.y + pp.ball.r > canvas.height) pp.ball.dy = -pp.ball.dy;

                // AI P2
                let p2Target = pp.ball.y - pp.p2.h / 2;
                pp.p2.y += (p2Target - pp.p2.y) * 0.08;

                if (pp.ball.x - pp.ball.r <= pp.p1.x + pp.p1.w && pp.ball.y >= pp.p1.y && pp.ball.y <= pp.p1.y + pp.p1.h) {
                    pp.ball.dx = -pp.ball.dx; playSound(400);
                }
                if (pp.ball.x + pp.ball.r >= pp.p2.x && pp.ball.y >= pp.p2.y && pp.ball.y <= pp.p2.y + pp.p2.h) {
                    pp.ball.dx = -pp.ball.dx; playSound(400);
                }
                if (pp.ball.x < 0) { pp.p2.score++; score += 50; scoreEl.innerText = score; pp.ball.x = canvas.width / 2; pp.ball.y = canvas.height / 2; }
                if (pp.ball.x > canvas.width) { pp.p1.score++; score += 100; scoreEl.innerText = score; pp.ball.x = canvas.width / 2; pp.ball.y = canvas.height / 2; }

            } else if (activeGameIndex === 5) {
                // Neon Asteroids
                if (keys["ArrowLeft"]) na.ship.angle -= 0.06;
                if (keys["ArrowRight"]) na.ship.angle += 0.06;
                if (keys["ArrowUp"]) {
                    na.ship.x += Math.cos(na.ship.angle) * 3;
                    na.ship.y += Math.sin(na.ship.angle) * 3;
                }
                na.ship.x = (na.ship.x + canvas.width) % canvas.width;
                na.ship.y = (na.ship.y + canvas.height) % canvas.height;

                for (let i = na.bullets.length - 1; i >= 0; i--) {
                    na.bullets[i].x += na.bullets[i].dx;
                    na.bullets[i].y += na.bullets[i].dy;
                    na.bullets[i].life--;
                    if (na.bullets[i].life <= 0) na.bullets.splice(i, 1);
                }
                na.asteroids.forEach(ast => {
                    ast.x += ast.dx; ast.y += ast.dy;
                    ast.x = (ast.x + canvas.width) % canvas.width;
                    ast.y = (ast.y + canvas.height) % canvas.height;
                });
            }
        }

        // --- DRAW LOOP ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Arka Plan Grid
            ctx.strokeStyle = "rgba(0, 240, 255, 0.03)";
            for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            if (activeGameIndex === 0) {
                // Neon Bounce Çizim
                nb.bricks.forEach(b => {
                    if (b.status === 1) {
                        ctx.shadowBlur = 10; ctx.shadowColor = b.color; ctx.fillStyle = b.color;
                        ctx.fillRect(b.x, b.y, b.w, b.h); ctx.shadowBlur = 0;
                    }
                });
                ctx.shadowBlur = 15; ctx.shadowColor = nb.paddle.color; ctx.fillStyle = nb.paddle.color;
                ctx.fillRect(nb.paddle.x, nb.paddle.y, nb.paddle.w, nb.paddle.h);
                ctx.fillStyle = nb.ball.color; ctx.shadowColor = nb.ball.color;
                ctx.beginPath(); ctx.arc(nb.ball.x, nb.ball.y, nb.ball.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;

            } else if (activeGameIndex === 1) {
                // Cyber Snake X Çizim
                ctx.fillStyle = "#00ff66"; ctx.shadowBlur = 12; ctx.shadowColor = "#00ff66";
                ctx.fillRect(cs.food.x * cs.gridSize, cs.food.y * cs.gridSize, cs.gridSize - 2, cs.gridSize - 2);
                cs.snake.forEach((s, idx) => {
                    ctx.fillStyle = idx === 0 ? "#ff007f" : "#00f0ff";
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.fillRect(s.x * cs.gridSize, s.y * cs.gridSize, cs.gridSize - 2, cs.gridSize - 2);
                });
                ctx.shadowBlur = 0;

            } else if (activeGameIndex === 2) {
                // Neon Invaders Çizim
                ctx.fillStyle = "#00f0ff"; ctx.shadowBlur = 15; ctx.shadowColor = "#00f0ff";
                ctx.fillRect(ni.ship.x, ni.ship.y, ni.ship.w, ni.ship.h);
                ctx.fillStyle = "#ffe600";
                ni.bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
                ni.aliens.forEach(a => {
                    if (a.status === 1) {
                        ctx.fillStyle = a.color; ctx.shadowColor = a.color;
                        ctx.fillRect(a.x, a.y, a.w, a.h);
                    }
                });
                ctx.shadowBlur = 0;

            } else if (activeGameIndex === 3) {
                // Graviton Jump Çizim
                ctx.fillStyle = "#00ff66"; ctx.shadowBlur = 15; ctx.shadowColor = "#00ff66";
                ctx.fillRect(gj.player.x, gj.player.y, gj.player.w, gj.player.h);
                ctx.fillStyle = "#00f0ff"; ctx.shadowColor = "#00f0ff";
                gj.platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
                ctx.shadowBlur = 0;

            } else if (activeGameIndex === 4) {
                // Pulse Pong Çizim
                ctx.fillStyle = "#ff007f"; ctx.shadowBlur = 12; ctx.shadowColor = "#ff007f";
                ctx.fillRect(pp.p1.x, pp.p1.y, pp.p1.w, pp.p1.h);
                ctx.fillStyle = "#00f0ff"; ctx.shadowColor = "#00f0ff";
                ctx.fillRect(pp.p2.x, pp.p2.y, pp.p2.w, pp.p2.h);
                ctx.fillStyle = "#ffe600"; ctx.shadowColor = "#ffe600";
                ctx.beginPath(); ctx.arc(pp.ball.x, pp.ball.y, pp.ball.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;

            } else if (activeGameIndex === 5) {
                // Neon Asteroids Çizim
                ctx.save();
                ctx.translate(na.ship.x, na.ship.y);
                ctx.rotate(na.ship.angle);
                ctx.strokeStyle = "#ff007f"; ctx.lineWidth = 3; ctx.shadowBlur = 10; ctx.shadowColor = "#ff007f";
                ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-12, -10); ctx.lineTo(-12, 10); ctx.closePath(); ctx.stroke();
                ctx.restore();

                ctx.fillStyle = "#00f0ff";
                na.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill(); });
                ctx.strokeStyle = "#ffe600"; ctx.lineWidth = 2;
                na.asteroids.forEach(ast => {
                    ctx.beginPath(); ctx.arc(ast.x, ast.y, ast.radius, 0, Math.PI * 2); ctx.stroke();
                });
                ctx.shadowBlur = 0;
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
