<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeonBounce 2D - Classic Arcade Edition</title>
    <style>
        :root {
            --bg-color: #020205;
            --panel-bg: rgba(10, 10, 20, 0.9);
            --pure-cyan: #00f0ff;
            --pure-pink: #ff007f;
            --pure-yellow: #ffe600;
            --pure-green: #00ff66;
            --pure-purple: #9d00ff;
            --text-main: #ffffff;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 4px;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        h1 {
            font-size: 1.1rem;
            color: var(--pure-cyan);
            margin: 2px 0;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }

        .hud {
            display: flex;
            justify-content: space-between;
            max-width: 800px;
            margin: 0 auto 4px auto;
            padding: 6px 14px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        .hud-item { display: flex; align-items: center; gap: 5px; }
        .hud-item span { color: var(--pure-cyan); }
        .hud-item.lives span { color: var(--pure-pink); }
        .hud-item.high span { color: var(--pure-yellow); }
        .hud-item.level span { color: var(--pure-green); }
        .hud-item.combo span { color: var(--pure-purple); }

        .canvas-container {
            position: relative;
            display: inline-block;
            margin: 0 auto;
        }

        #gameCanvas {
            background: #05050c;
            border: 1px solid rgba(0, 240, 255, 0.6);
            border-radius: 6px;
            display: block;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            max-width: 95vw;
            max-height: 74vh;
            width: 800px;
            height: 950px;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(2, 2, 5, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 6px;
        }

        .overlay.hidden { display: none; }

        .overlay h2 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--pure-pink);
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.7);
            letter-spacing: 2px;
        }

        .overlay p {
            font-size: 0.95rem;
            color: #b8b8d8;
            margin-bottom: 20px;
            padding: 0 20px;
            max-width: 550px;
            line-height: 1.4;
        }

        .btn {
            background: linear-gradient(135deg, var(--pure-cyan), #0077ff);
            color: #000000;
            border: 1px solid #ffffff;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            transition: all 0.2s ease;
        }

        .btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 240, 255, 0.9); }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <h1>⚡ NEON BOUNCE 2D : CLASSIC EDITION ⚡</h1>
    <div class="hud">
        <div class="hud-item">⭐ SKOR: <span id="scoreVal">0</span></div>
        <div class="hud-item high">🏆 REKOR: <span id="highVal">0</span></div>
        <div class="hud-item combo">🔥 KOMBO: <span id="comboVal">x1</span></div>
        <div class="hud-item lives">🛡️ CAN: <span id="livesVal">3</span></div>
        <div class="hud-item level">📊 LVL: <span id="levelVal">1</span></div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="800" height="950"></canvas>
        
        <!-- Ana Menü -->
        <div id="menuOverlay" class="overlay">
            <h2>CLASSIC ARCADE</h2>
            <p>Saf 2D Akıcılık: Kayan raket, zarif tuğla dizilimi, özel ödüller, kombo çarpanları ve zırhlı boss tuğlalar!</p>
            <button class="btn" id="startBtn">OYUNA BAŞLA</button>
        </div>

        <!-- Game Over -->
        <div id="gameOverOverlay" class="overlay hidden">
            <h2>OYUN BİTTİ</h2>
            <p id="finalScoreText">Skorun: 0</p>
            <button class="btn" id="restartBtn">TEKRAR DENE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreEl = document.getElementById("scoreVal");
        const highEl = document.getElementById("highVal");
        const comboEl = document.getElementById("comboVal");
        const livesEl = document.getElementById("livesVal");
        const levelEl = document.getElementById("levelVal");
        const menuOverlay = document.getElementById("menuOverlay");
        const gameOverOverlay = document.getElementById("gameOverOverlay");
        const finalScoreText = document.getElementById("finalScoreText");
        const startBtn = document.getElementById("startBtn");
        const restartBtn = document.getElementById("restartBtn");

        let gameState = "MENU";
        let score = 0;
        let highScore = localStorage.getItem("neon_2d_high") || 0;
        let lives = 3;
        let level = 1;
        let combo = 1;
        let comboTimer = 0;
        highEl.innerText = highScore;

        // Raket (Kayan)
        let paddle = {
            x: canvas.width / 2 - 70,
            y: canvas.height - 50,
            w: 140,
            h: 18,
            dx: 0,
            color: "#ff007f"
        };

        let balls = [];
        let bricks = [];
        let powerUps = [];
        let particles = [];

        function createBall(x, y, dx, dy) {
            balls.push({
                x: x,
                y: y,
                r: 9,
                dx: dx,
                dy: dy,
                color: "#00f0ff"
            });
        }

        // Ses Efektleri (Web Audio API)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === "hit") {
                    osc.type = "sine"; osc.frequency.setValueAtTime(320 + combo * 15, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.05);
                    gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                } else if (type === "brick") {
                    osc.type = "triangle"; osc.frequency.setValueAtTime(420 + combo * 30, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                } else if (type === "boss") {
                    osc.type = "square"; osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                } else if (type === "powerup") {
                    osc.type = "square"; osc.frequency.setValueAtTime(580, now);
                    osc.frequency.setValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                } else if (type === "gameover") {
                    osc.type = "sawtooth"; osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.4);
                    gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                }
                osc.start(now); osc.stop(now + 0.4);
            } catch(e) {}
        }

        function initLevel() {
            bricks = [];
            powerUps = [];

            let rows = 5 + Math.min(level, 4);
            let cols = 9;
            let bWidth = 72;
            let bHeight = 24;
            let padding = 12;
            let offsetTop = 70;
            let offsetLeft = (canvas.width - (cols * (bWidth + padding) - padding)) / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let isBoss = (r === 0 && Math.random() < 0.5);
                    let health = isBoss ? 2 : 1;
                    let colors = ["#ff007f", "#ffe600", "#00f0ff", "#00ff66", "#9d00ff"];
                    let color = isBoss ? "#ffe600" : colors[r % colors.length];

                    let hasPowerUp = Math.random() < 0.22;
                    let pTypes = ['WIDEN', 'MULTI', 'SLOW'];
                    let pType = pTypes[Math.floor(Math.random() * pTypes.length)];

                    bricks.push({
                        x: offsetLeft + c * (bWidth + padding),
                        y: offsetTop + r * (bHeight + padding),
                        w: bWidth,
                        h: bHeight,
                        status: 1,
                        health: health,
                        isBoss: isBoss,
                        color: color,
                        hasPowerUp: hasPowerUp,
                        pType: pType
                    });
                }
            }
        }

        function resetGameBalls() {
            balls = [];
            paddle.w = 140;
            paddle.x = canvas.width / 2 - paddle.w / 2;
            combo = 1;
            comboEl.innerText = "x" + combo;

            let speed = 4 + (level * 0.5);
            createBall(canvas.width / 2, paddle.y - 20, (Math.random() > 0.5 ? 1 : -1) * speed * 0.7, -speed);
        }

        function startGame() {
            initAudio();
            score = 0;
            lives = 3;
            level = 1;
            scoreEl.innerText = score;
            livesEl.innerText = lives;
            levelEl.innerText = level;
            menuOverlay.classList.add("hidden");
            gameOverOverlay.classList.add("hidden");
            initLevel();
            resetGameBalls();
            gameState = "PLAYING";
        }

        function triggerGameOver() {
            gameState = "GAMEOVER";
            playSound("gameover");
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("neon_2d_high", highScore);
                highEl.innerText = highScore;
            }
            finalScoreText.innerText = "Toplam Skorun: " + score;
            gameOverOverlay.classList.remove("hidden");
        }

        function spawnPowerUp(x, y, type) {
            let color = type === 'MULTI' ? '#00f0ff' : (type === 'WIDEN' ? '#00ff66' : '#ff007f');
            powerUps.push({
                x: x,
                y: y,
                w: 26,
                h: 26,
                dy: 2.5,
                type: type,
                color: color
            });
        }

        function applyPowerUp(type) {
            playSound("powerup");
            if (type === 'WIDEN') {
                paddle.w = 190;
            } else if (type === 'MULTI') {
                if (balls.length > 0) {
                    let b = balls[0];
                    createBall(b.x, b.y, -b.dx, b.dy);
                    createBall(b.x, b.y, b.dx * 0.5, b.dy * 1.2);
                }
            } else if (type === 'SLOW') {
                balls.forEach(b => { b.dx *= 0.7; b.dy *= 0.7; });
            }
        }

        // Parçacık Patlaması
        function createParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 1 + Math.random() * 3;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    radius: 3 + Math.random() * 3,
                    color: color,
                    life: 25
                });
            }
        }

        // Kontroller (Kayan Raket)
        let mouseX = canvas.width / 2;
        canvas.addEventListener("mousemove", (e) => {
            let rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            paddle.x = mouseX - paddle.w / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;
        });

        canvas.addEventListener("touchmove", (e) => {
            let rect = canvas.getBoundingClientRect();
            mouseX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
            paddle.x = mouseX - paddle.w / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;
            e.preventDefault();
        }, { passive: false });

        startBtn.addEventListener("click", startGame);
        restartBtn.addEventListener("click", startGame);

        function update() {
            if (gameState !== "PLAYING") return;

            // Kombo zaman aşımı
            if (combo > 1) {
                comboTimer--;
                if (comboTimer <= 0) {
                    combo = 1;
                    comboEl.innerText = "x" + combo;
                }
            }

            // Parçacıkları Güncelle
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Topları Güncelle
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                b.x += b.dx;
                b.y += b.dy;

                // Duvar Çarpışmaları
                if (b.x - b.r < 0) { b.x = b.r; b.dx = -b.dx; playSound("hit"); }
                if (b.x + b.r > canvas.width) { b.x = canvas.width - b.r; b.dx = -b.dx; playSound("hit"); }
                if (b.y - b.r < 0) { b.y = b.r; b.dy = -b.dy; playSound("hit"); }

                // Raket Çarpışması
                if (
                    b.y + b.r >= paddle.y &&
                    b.y - b.r <= paddle.y + paddle.h &&
                    b.x >= paddle.x &&
                    b.x <= paddle.x + paddle.w
                ) {
                    b.dy = -Math.abs(b.dy);
                    let hitPoint = b.x - (paddle.x + paddle.w / 2);
                    b.dx = hitPoint * 0.15;
                    playSound("hit");
                }

                // Top Düşme
                if (b.y > canvas.height + 20) {
                    balls.splice(i, 1);
                }
            }

            if (balls.length === 0) {
                lives--;
                livesEl.innerText = lives;
                combo = 1; comboEl.innerText = "x" + combo;
                if (lives <= 0) {
                    triggerGameOver();
                } else {
                    resetGameBalls();
                }
            }

            // Ödülleri Güncelle
            for (let i = powerUps.length - 1; i >= 0; i--) {
                let p = powerUps[i];
                p.y += p.dy;

                if (
                    p.y + p.h >= paddle.y &&
                    p.y <= paddle.y + paddle.h &&
                    p.x + p.w >= paddle.x &&
                    p.x <= paddle.x + paddle.w
                ) {
                    applyPowerUp(p.type);
                    powerUps.splice(i, 1);
                } else if (p.y > canvas.height) {
                    powerUps.splice(i, 1);
                }
            }

            // Tuğla Çarpışmaları
            let activeBricks = 0;
            bricks.forEach(b => {
                if (b.status === 1) {
                    activeBricks++;
                    for (let i = 0; i < balls.length; i++) {
                        let ball = balls[i];
                        if (
                            ball.x + ball.r > b.x &&
                            ball.x - ball.r < b.x + b.w &&
                            ball.y + ball.r > b.y &&
                            ball.y - ball.r < b.y + b.h
                        ) {
                            ball.dy = -ball.dy;
                            b.health--;

                            if (b.health > 0) {
                                playSound("boss");
                                createParticles(ball.x, ball.y, "#ffe600");
                            } else {
                                b.status = 0;
                                playSound("brick");
                                createParticles(ball.x, ball.y, b.color);

                                combo++;
                                comboTimer = 180;
                                comboEl.innerText = "x" + combo;

                                score += 25 * combo;
                                scoreEl.innerText = score;

                                if (b.hasPowerUp) {
                                    spawnPowerUp(b.x + b.w / 2 - 13, b.y, b.pType);
                                }
                            }
                            break;
                        }
                    }
                }
            });

            if (activeBricks === 0) {
                score += 200 * level;
                level++;
                levelEl.innerText = level;
                initLevel();
                resetGameBalls();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Arka Plan Hafif Izgara Efekti
            ctx.strokeStyle = "rgba(0, 240, 255, 0.03)";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Tuğlalar
            bricks.forEach(b => {
                if (b.status === 1) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = b.color;
                    ctx.fillStyle = b.color;
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    
                    // İç Çizgi Detayı
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 1;
                    ctx.strokeRect(b.x, b.y, b.w, b.h);
                    ctx.shadowBlur = 0;
                }
            });

            // Ödüller
            powerUps.forEach(p => {
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.shadowBlur = 0;
            });

            // Parçacıklar
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Raket
            ctx.shadowBlur = 15;
            ctx.shadowColor = paddle.color;
            ctx.fillStyle = paddle.color;
            ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
            ctx.shadowBlur = 0;

            // Toplar
            balls.forEach(b => {
                ctx.shadowBlur = 15;
                ctx.shadowColor = b.color;
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
