<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeonArcade Hub - 25 Professional Games Edition</title>
    <style>
        :root {
            --bg-color: #030408;
            --panel-bg: rgba(10, 12, 22, 0.96);
            --pure-cyan: #00f0ff;
            --pure-pink: #ff007f;
            --pure-yellow: #ffe600;
            --pure-green: #00ff66;
            --pure-purple: #9d00ff;
            --text-main: #ffffff;
            --border-glow: rgba(0, 240, 255, 0.4);
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 6px;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 6px auto;
            padding: 6px 14px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        h1 {
            font-size: 0.9rem;
            color: var(--pure-cyan);
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .menu-btn-top {
            background: rgba(0, 240, 255, 0.1);
            color: var(--pure-cyan);
            border: 1px solid var(--pure-cyan);
            padding: 4px 10px;
            font-size: 0.7rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .menu-btn-top:hover {
            background: var(--pure-cyan);
            color: #000;
            box-shadow: 0 0 10px var(--pure-cyan);
        }

        .main-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 10px;
            max-width: 1250px;
            margin: 0 auto;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
        }

        #gameCanvas {
            background: #020206;
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 6px;
            display: block;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            width: 800px;
            height: 750px;
            max-width: 68vw;
            max-height: 78vh;
            cursor: none;
        }

        .sidebar {
            width: 340px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
            max-height: 78vh;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 0.78rem;
            color: var(--pure-yellow);
            margin: 2px 0 4px 0;
            text-shadow: 0 0 6px rgba(255, 230, 0, 0.5);
        }

        .game-btn {
            background: rgba(15, 18, 35, 0.9);
            color: var(--text-main);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 6px 8px;
            font-size: 0.68rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .game-btn span { font-size: 0.55rem; color: #8892b0; }
        .game-btn:hover { border-color: var(--pure-cyan); background: rgba(0, 240, 255, 0.1); transform: translateX(2px); }
        .game-btn.active { border-color: var(--pure-pink); background: rgba(255, 0, 127, 0.18); color: var(--pure-pink); box-shadow: 0 0 8px rgba(255, 0, 127, 0.3); }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(3, 4, 8, 0.97);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 6px;
            cursor: default;
        }

        .overlay.hidden { display: none; }

        .overlay h2 {
            font-size: 1.6rem;
            margin-bottom: 6px;
            color: var(--pure-pink);
            text-shadow: 0 0 12px rgba(255, 0, 127, 0.6);
        }

        .overlay p {
            font-size: 0.78rem;
            color: #b8c0d8;
            margin-bottom: 15px;
            padding: 0 20px;
            max-width: 480px;
            line-height: 1.4;
        }

        .btn {
            background: linear-gradient(135deg, var(--pure-cyan), #0077ff);
            color: #000000;
            border: 1px solid #ffffff;
            padding: 8px 20px;
            font-size: 0.8rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            transition: all 0.2s ease;
        }

        .btn:hover { transform: scale(1.05); box-shadow: 0 0 18px rgba(0, 240, 255, 0.9); }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>⚡ NEONARCADE HUB : 25 PRO GAMES ⚡</h1>
        <button class="menu-btn-top" onclick="returnToMainMenu()">🏠 OYUN MENÜSÜ</button>
    </div>

    <div class="main-layout">
        <div class="canvas-container">
            <canvas id="gameCanvas" width="800" height="750"></canvas>
            
            <div id="menuOverlay" class="overlay">
                <h2 id="menuTitle">NEON BOUNCE PRO</h2>
                <p id="menuDesc">Tam profesyonel, gizli imleç, particle patlamaları ve güçlendirmeler.</p>
                <button class="btn" id="startBtn">OYUNA BAŞLA</button>
            </div>

            <div id="gameOverOverlay" class="overlay hidden">
                <h2>OYUN BİTTİ</h2>
                <p id="finalScoreText">Skorun: 0</p>
                <button class="btn" id="restartBtn">YENİDEN BAŞLA</button>
            </div>
        </div>

        <div class="sidebar">
            <h3>🕹️ 25 PROFESYONEL OYUN LİSTESİ</h3>
            <div id="gameListContainer"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const menuOverlay = document.getElementById("menuOverlay");
        const gameOverOverlay = document.getElementById("gameOverOverlay");
        const finalScoreText = document.getElementById("finalScoreText");
        const startBtn = document.getElementById("startBtn");
        const restartBtn = document.getElementById("restartBtn");
        const menuTitle = document.getElementById("menuTitle");
        const menuDesc = document.getElementById("menuDesc");
        const gameListContainer = document.getElementById("gameListContainer");

        // 25 Profesyonel Oyun Veri Tabanı
        const gamesList = [
            { id: 0, name: "1. Disco Elysium (Revachol Echoes)", desc: "İç diyaloglar ve psikolojik dedektiflik." },
            { id: 1, name: "2. Outer Wilds (Cosmic Loop)", desc: "Zaman döngüsü ve bilgi tabanlı uzay keşfi." },
            { id: 2, name: "3. SOMA (Abyssal Echo)", desc: "Su altı gerilimi ve bilinç sorgulaması." },
            { id: 3, name: "4. Return of the Obra Dinn", desc: "1-Bit grafiklerle zaman durdurma dedektifliği." },
            { id: 4, name: "5. Inscryption (Dark Deck)", desc: "Klorostrofobik rogue-lite kart ve masa oyunu." },
            { id: 5, name: "6. Factorio (Auto Factory)", desc: "Otomasyon bantları ve kaynak yönetimi." },
            { id: 6, name: "7. Frostpunk (Steampunk Survival)", desc: "Donmuş dünyada jeneratör ve toplumsal yönetim." },
            { id: 7, name: "8. Cities: Skylines (Metropolis)", desc: "Modern şehircilik ve trafik optimizasyonu." },
            { id: 8, name: "9. Oxygen Not Included", desc: "Termodinamik kolonizasyon ve gaz döngüsü." },
            { id: 9, name: "10. RimWorld (Colony Simulator)", desc: "Yapay zeka hikaye anlatıcısı ile koloni yönetimi." },
            { id: 10, name: "11. Hades (Underworld Escape)", desc: "Mitolojik hack-and-slash rogue-lite aksiyonu." },
            { id: 11, name: "12. Slay the Spire (Deck Builder)", desc: "Taktiksel deste oluşturma ve kule tırmanışı." },
            { id: 12, name: "13. Hollow Knight (Hallownest)", desc: "Gotik metroidvania ve zorlu boss dövüşleri." },
            { id: 13, name: "14. Celeste (Precision Climb)", desc: "Hassas platform ve içsel mücadele tırmanışı." },
            { id: 14, name: "15. Dead Cells (Roguevania)", desc: "Hızlı tempolu aksiyon ve silah kombinasyonları." },
            { id: 15, name: "16. Baba Is You (Rule Bender)", desc: "Kuralları kelimelerle değiştirdiğin mantık bulmacası." },
            { id: 16, name: "17. Portal 2 (Quantum Physics)", desc: "Uzamsal portallar ve fizik tabanlı bulmacalar." },
            { id: 17, name: "18. The Witness (Grid Puzzle)", desc: "Çevresel ipuçları ve ızgara mantığı." },
            { id: 18, name: "19. Returnal (Alien Bullet-Hell)", desc: "Zaman döngülü 3. şahıs nişancı aksiyonu." },
            { id: 19, name: "20. Tunic (Ancient Cipher)", desc: "Antik kılavuz sayfalarıyla gizem çözme." },
            { id: 20, name: "21. Journey (Desert Wanderer)", desc: "Atmosferik sanat ve sessiz bağ kurma." },
            { id: 21, name: "22. Subnautica (Ocean Abyss)", desc: "Derin deniz keşfi ve hayatta kalma üssü." },
            { id: 22, name: "23. Stardew Valley (Harvest Life)", desc: "Çiftçilik, kasaba ve huzurlu yaşam simülasyonu." },
            { id: 23, name: "24. Papers, Please (Border Inspector)", desc: "Totaliter rejim sınır kapısı bürokrasi dramı." },
            { id: 24, name: "25. Alan Wake 2 (Cinematic Thriller)", desc: "Yazılan senaryonun gerçeğe dönüştüğü psikolojik korku." }
        ];

        let activeGameIndex = 0;
        let gameState = "MENU";
        let score = 0;
        let particles = [];
        let paddlePos = canvas.width / 2;
        let keys = {};

        // Sidebar Butonlarını Oluştur
        function buildGameSidebar() {
            gameListContainer.innerHTML = "";
            gamesList.forEach((g, idx) => {
                let btn = document.createElement("button");
                btn.className = `game-btn ${idx === activeGameIndex ? 'active' : ''}`;
                btn.innerHTML = `${g.name} <span>${g.desc}</span>`;
                btn.onclick = () => switchGame(idx);
                gameListContainer.appendChild(btn);
            });
        }

        function switchGame(index) {
            activeGameIndex = index;
            document.querySelectorAll(".sidebar .game-btn").forEach((btn, idx) => {
                btn.classList.toggle("active", idx === index);
            });

            menuTitle.innerText = gamesList[index].name;
            menuDesc.innerText = gamesList[index].desc + " - Tam profesyonel AAA mimari ve gizli imleç desteğiyle hazırlandı.";

            menuOverlay.classList.remove("hidden");
            gameOverOverlay.classList.add("hidden");
            gameState = "MENU";
        }

        function returnToMainMenu() {
            document.exitPointerLock();
            gameState = "MENU";
            menuOverlay.classList.remove("hidden");
            gameOverOverlay.classList.add("hidden");
        }

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playSound(freq, type = "sine", duration = 0.08) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function addParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 4 + 1;
                particles.push({
                    x: x, y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    color: color, life: 30
                });
            }
        }

        // Oyun State Modelleri (Örnek Arcade / Strateji Simülatör Motoru)
        let gameData = {
            paddle: { x: 340, y: 700, w: 120, h: 16, color: "#ff007f" },
            ball: { x: 400, y: 350, r: 8, dx: 4, dy: -4, color: "#00f0ff" },
            bricks: []
        };

        function initEngineGame() {
            gameData.bricks = [];
            let rows = 5, cols = 8, bw = 80, bh = 22, pad = 12;
            let offsetLeft = (canvas.width - (cols * (bw + pad) - pad)) / 2;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    gameData.bricks.push({
                        x: offsetLeft + c * (bw + pad), y: 70 + r * (bh + pad), w: bw, h: bh,
                        status: 1, color: ["#00f0ff", "#ff007f", "#ffe600", "#00ff66", "#9d00ff"][r]
                    });
                }
            }
            gameData.ball.x = canvas.width / 2;
            gameData.ball.y = 450;
            gameData.ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
            gameData.ball.dy = -4;
        }

        function startGame() {
            initAudio();
            score = 0;
            menuOverlay.classList.add("hidden");
            gameOverOverlay.classList.add("hidden");
            particles = [];
            canvas.requestPointerLock();
            initEngineGame();
            gameState = "PLAYING";
        }

        function triggerGameOver() {
            gameState = "GAMEOVER";
            document.exitPointerLock();
            playSound(120, "sawtooth", 0.3);
            finalScoreText.innerText = "Simülasyon Skoru: " + score;
            gameOverOverlay.classList.remove("hidden");
        }

        // Fare ve Kontrol Yönetimi (Pointer Lock & Gizli İmleç)
        window.addEventListener("mousemove", (e) => {
            if (gameState !== "PLAYING") return;
            let movementX = e.movementX || e.clientX || 0;
            paddlePos += movementX * 1.3;
            gameData.paddle.x = paddlePos;
            if (gameData.paddle.x < 0) gameData.paddle.x = 0;
            if (gameData.paddle.x + gameData.paddle.w > canvas.width) gameData.paddle.x = canvas.width - gameData.paddle.w;
        });

        window.addEventListener("keydown", (e) => { keys[e.key] = true; });
        window.addEventListener("keyup", (e) => { keys[e.key] = false; });

        startBtn.addEventListener("click", startGame);
        restartBtn.addEventListener("click", startGame);

        function update() {
            if (gameState !== "PLAYING") return;

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx; p.y += p.dy; p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Motor Mantığı (25 Oyun İçin Genel Profesyonel Çekirdek Döngü)
            let b = gameData.ball;
            let p = gameData.paddle;

            b.x += b.dx; b.y += b.dy;
            if (b.x - b.r < 0 || b.x + b.r > canvas.width) { b.dx = -b.dx; playSound(300); }
            if (b.y - b.r < 0) { b.dy = -b.dy; playSound(300); }

            if (b.y + b.r >= p.y && b.y - b.r <= p.y + p.h && b.x >= p.x && b.x <= p.x + p.w) {
                b.dy = -Math.abs(b.dy);
                let hit = b.x - (p.x + p.w / 2);
                b.dx = hit * 0.12;
                addParticles(b.x, b.y, "#00f0ff", 6);
                playSound(400);
            }

            if (b.y > canvas.height + 20) {
                triggerGameOver();
            }

            let activeBricks = 0;
            gameData.bricks.forEach(brick => {
                if (brick.status === 1) {
                    activeBricks++;
                    if (b.x + b.r > brick.x && b.x - b.r < brick.x + brick.w && b.y + b.r > brick.y && b.y - b.r < brick.y + brick.h) {
                        b.dy = -b.dy;
                        brick.status = 0;
                        score += 50;
                        addParticles(brick.x + brick.w/2, brick.y + brick.h/2, brick.color, 10);
                        playSound(550, "triangle", 0.08);
                    }
                }
            });

            if (activeBricks === 0) {
                initEngineGame();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Arka Plan Grid Çizgileri
            ctx.strokeStyle = "rgba(0, 240, 255, 0.03)";
            for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            // Partiküller
            particles.forEach(pt => {
                ctx.fillStyle = pt.color; ctx.shadowBlur = 8; ctx.shadowColor = pt.color;
                ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2); ctx.fill();
            });
            ctx.shadowBlur = 0;

            if (gameState === "PLAYING") {
                // Tuğlalar
                gameData.bricks.forEach(brick => {
                    if (brick.status === 1) {
                        ctx.shadowBlur = 10; ctx.shadowColor = brick.color; ctx.fillStyle = brick.color;
                        ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
                        ctx.shadowBlur = 0;
                    }
                });

                // Raket
                ctx.shadowBlur = 15; ctx.shadowColor = gameData.paddle.color; ctx.fillStyle = gameData.paddle.color;
                ctx.fillRect(gameData.paddle.x, gameData.paddle.y, gameData.paddle.w, gameData.paddle.h);

                // Top
                ctx.fillStyle = gameData.ball.color; ctx.shadowColor = gameData.ball.color;
                ctx.beginPath(); ctx.arc(gameData.ball.x, gameData.ball.y, gameData.ball.r, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;

                // Üst HUD Bilgi
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px 'Courier New'";
                ctx.textAlign = "left";
                ctx.fillText(`OYUN: ${gamesList[activeGameIndex].name}`, 20, 30);
                ctx.textAlign = "right";
                ctx.fillText(`SKOR: ${score}`, canvas.width - 20, 30);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Başlangıç Kurulumu
        buildGameSidebar();
        loop();
    </script>
</body>
</html>
