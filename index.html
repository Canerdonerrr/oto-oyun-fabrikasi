<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeonBounce - Pure Retro Edition</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #111111;
            --pure-cyan: #00ffff;
            --pure-pink: #ff00ff;
            --pure-purple: #9900ff;
            --pure-yellow: #ffff00;
            --text-main: #ffffff;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 5px;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--pure-cyan);
            margin: 4px 0;
            letter-spacing: 2px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            max-width: 440px;
            margin: 0 auto 4px auto;
            padding: 6px 12px;
            background: var(--panel-bg);
            border: 2px solid var(--pure-cyan);
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .hud-item span { color: var(--pure-cyan); }
        .hud-item.lives span { color: var(--pure-pink); }
        .hud-item.high span { color: var(--pure-yellow); }

        .canvas-container {
            position: relative;
            display: inline-block;
            margin: 0 auto;
        }

        canvas {
            background: #000000;
            border: 2px solid var(--pure-cyan);
            display: block;
            border-radius: 4px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 4px;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--pure-pink);
        }

        .overlay p {
            font-size: 0.95rem;
            color: #cccccc;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .btn {
            background: var(--pure-cyan);
            color: #000000;
            border: 2px solid #ffffff;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }

        .btn:active {
            background: #ffffff;
            color: var(--pure-cyan);
        }
    </style>
</head>
<body>

    <h1>NEON BOUNCE</h1>
    <div class="hud">
        <div class="hud-item">SKOR: <span id="scoreVal">0</span></div>
        <div class="hud-item high">REKOR: <span id="highVal">0</span></div>
        <div class="hud-item lives">CAN: <span id="livesVal">3</span></div>
    </div>

    <div class="canvas-container">
        <!-- Genişletilmiş Oyun Alanı (440x560) -->
        <canvas id="gameCanvas" width="440" height="560"></canvas>
        
        <!-- Menü Ekranı -->
        <div id="menuOverlay" class="overlay">
            <h2>NEON BOUNCE</h2>
            <p>Tuğlaları kır, güçlendiricileri topla!</p>
            <button class="btn" id="startBtn">OYUNA BAŞLA</button>
        </div>

        <!-- Game Over Ekranı -->
        <div id="gameOverOverlay" class="overlay hidden">
            <h2>OYUN BİTTİ</h2>
            <p id="finalScoreText">Skorun: 0</p>
            <button class="btn" id="restartBtn">TEKRAR DENE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreEl = document.getElementById("scoreVal");
        const highEl = document.getElementById("highVal");
        const livesEl = document.getElementById("livesVal");
        const menuOverlay = document.getElementById("menuOverlay");
        const gameOverOverlay = document.getElementById("gameOverOverlay");
        const finalScoreText = document.getElementById("finalScoreText");
        const startBtn = document.getElementById("startBtn");
        const restartBtn = document.getElementById("restartBtn");

        let gameState = "MENU"; 
        let score = 0;
        let highScore = localStorage.getItem("neon_pure_high") || 0;
        let lives = 3;
        highEl.innerText = highScore;

        // Web Audio API Sentezleyici
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === "hit") {
                    osc.type = "square";
                    osc.frequency.setValueAtTime(220, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === "brick") {
                    osc.type = "square";
                    osc.frequency.setValueAtTime(440, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === "powerup") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === "gameover") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch(e) {}
        }

        let paddle = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 35,
            width: 100,
            height: 12,
            color: "#ff00ff",
            targetWidth: 100
        };

        let balls = [];
        let bricks = [];
        let powerUps = [];

        function initLevel() {
            bricks = [];
            let rows = 5;
            let cols = 7;
            let brickWidth = 50;
            let brickHeight = 18;
            let padding = 8;
            let offsetTop = 50;
            let offsetLeft = 21;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let health = (r === 0 || r === 1) ? 2 : 1;
                    let color = health === 2 ? "#9900ff" : "#00ffff";
                    bricks.push({
                        x: offsetLeft + c * (brickWidth + padding),
                        y: offsetTop + r * (brickHeight + padding),
                        width: brickWidth,
                        height: brickHeight,
                        health: health,
                        color: color
                    });
                }
            }
        }

        function resetBallAndPaddle() {
            paddle.width = 100;
            paddle.targetWidth = 100;
            paddle.x = canvas.width / 2 - paddle.width / 2;
            balls = [{
                x: canvas.width / 2,
                y: paddle.y - 15,
                radius: 6,
                speedX: 3.5 * (Math.random() > 0.5 ? 1 : -1),
                speedY: -4.5,
                color: "#00ffff"
            }];
        }

        function startGame() {
            initAudio();
            score = 0;
            lives = 3;
            scoreEl.innerText = score;
            livesEl.innerText = lives;
            menuOverlay.classList.add("hidden");
            gameOverOverlay.classList.add("hidden");
            initLevel();
            resetBallAndPaddle();
            gameState = "PLAYING";
        }

        function triggerGameOver() {
            gameState = "GAMEOVER";
            playSound("gameover");
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("neon_pure_high", highScore);
                highEl.innerText = highScore;
            }
            finalScoreText.innerText = "Toplam Skorun: " + score;
            gameOverOverlay.classList.remove("hidden");
        }

        function handlePointerMove(clientX) {
            let rect = canvas.getBoundingClientRect();
            let rootX = clientX - rect.left;
            paddle.x = rootX - paddle.width / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
        }

        canvas.addEventListener("mousemove", (e) => {
            if (gameState === "PLAYING") handlePointerMove(e.clientX);
        });
        canvas.addEventListener("touchmove", (e) => {
            if (gameState === "PLAYING") {
                handlePointerMove(e.touches[0].clientX);
                e.preventDefault();
            }
        }, { passive: false });

        startBtn.addEventListener("click", startGame);
        restartBtn.addEventListener("click", startGame);

        function spawnPowerUp(x, y) {
            if (Math.random() < 0.35) {
                let types = ["wide", "multiball"];
                let type = types[Math.floor(Math.random() * types.length)];
                powerUps.push({
                    x: x,
                    y: y,
                    width: 20,
                    height: 12,
                    dy: 2.5,
                    type: type,
                    color: type === "wide" ? "#ffff00" : "#ff00ff"
                });
            }
        }

        function update() {
            if (gameState !== "PLAYING") return;

            if (paddle.width !== paddle.targetWidth) {
                paddle.width += (paddle.targetWidth - paddle.width) * 0.2;
            }

            for (let i = powerUps.length - 1; i >= 0; i--) {
                let pu = powerUps[i];
                pu.y += pu.dy;

                if (
                    pu.y + pu.height >= paddle.y &&
                    pu.y <= paddle.y + paddle.height &&
                    pu.x + pu.width >= paddle.x &&
                    pu.x <= paddle.x + paddle.width
                ) {
                    playSound("powerup");
                    if (pu.type === "wide") {
                        paddle.targetWidth = 140;
                        setTimeout(() => { paddle.targetWidth = 100; }, 8000);
                    } else if (pu.type === "multiball" && balls.length > 0) {
                        let b = balls[0];
                        balls.push({
                            x: b.x,
                            y: b.y,
                            radius: 6,
                            speedX: -b.speedX,
                            speedY: b.speedY,
                            color: "#ffff00"
                        });
                    }
                    powerUps.splice(i, 1);
                    continue;
                }

                if (pu.y > canvas.height) {
                    powerUps.splice(i, 1);
                }
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                let ball = balls[i];
                ball.x += ball.speedX;
                ball.y += ball.speedY;

                if (ball.x - ball.radius < 0) {
                    ball.x = ball.radius;
                    ball.speedX = -ball.speedX;
                    playSound("hit");
                }
                if (ball.x + ball.radius > canvas.width) {
                    ball.x = canvas.width - ball.radius;
                    ball.speedX = -ball.speedX;
                    playSound("hit");
                }
                if (ball.y - ball.radius < 0) {
                    ball.y = ball.radius;
                    ball.speedY = -ball.speedY;
                    playSound("hit");
                }

                if (
                    ball.y + ball.radius >= paddle.y &&
                    ball.y - ball.radius <= paddle.y + paddle.height &&
                    ball.x >= paddle.x &&
                    ball.x <= paddle.x + paddle.width
                ) {
                    ball.speedY = -Math.abs(ball.speedY);
                    let hitPoint = ball.x - (paddle.x + paddle.width / 2);
                    ball.speedX = hitPoint * 0.15;
                    playSound("hit");
                }

                for (let j = bricks.length - 1; j >= 0; j--) {
                    let b = bricks[j];
                    if (
                        ball.x + ball.radius > b.x &&
                        ball.x - ball.radius < b.x + b.width &&
                        ball.y + ball.radius > b.y &&
                        ball.y - ball.radius < b.y + b.height
                    ) {
                        ball.speedY = -ball.speedY;
                        b.health--;
                        playSound("brick");

                        if (b.health <= 0) {
                            spawnPowerUp(b.x + b.width / 2, b.y + b.height / 2);
                            bricks.splice(j, 1);
                            score += 25;
                        } else {
                            score += 10;
                            b.color = "#00ffff";
                        }
                        scoreEl.innerText = score;
                        break;
                    }
                }

                if (ball.y > canvas.height + ball.radius) {
                    balls.splice(i, 1);
                }
            }

            if (balls.length === 0) {
                lives--;
                livesEl.innerText = lives;
                if (lives <= 0) {
                    triggerGameOver();
                } else {
                    resetBallAndPaddle();
                }
            }

            if (bricks.length === 0) {
                score += 150;
                initLevel();
                resetBallAndPaddle();
            }
        }

        function draw() {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === "PLAYING" || gameState === "GAMEOVER") {
                bricks.forEach(b => {
                    ctx.fillStyle = b.color;
                    ctx.fillRect(b.x, b.y, b.width, b.height);
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 1;
                    ctx.strokeRect(b.x, b.y, b.width, b.height);
                });

                powerUps.forEach(pu => {
                    ctx.fillStyle = pu.color;
                    ctx.fillRect(pu.x, pu.y, pu.width, pu.height);
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 1;
                    ctx.strokeRect(pu.x, pu.y, pu.width, pu.height);
                });

                ctx.fillStyle = paddle.color;
                ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 1;
                ctx.strokeRect(paddle.x, paddle.y, paddle.width, paddle.height);

                balls.forEach(ball => {
                    ctx.fillStyle = ball.color;
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                });
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
