<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeonArcade Hub - 1. Disco Elysium Pro Engine</title>
    <style>
        :root {
            --bg-color: #030408;
            --panel-bg: rgba(10, 12, 22, 0.98);
            --pure-cyan: #00f0ff;
            --pure-pink: #ff007f;
            --pure-yellow: #ffe600;
            --text-main: #ffffff;
            --border-glow: rgba(0, 240, 255, 0.4);
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 4px;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto 4px auto;
            padding: 6px 12px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
        }

        h1 {
            font-size: 0.75rem;
            color: var(--pure-cyan);
            margin: 0;
            letter-spacing: 1px;
        }

        .menu-btn-top {
            background: rgba(0, 240, 255, 0.1);
            color: var(--pure-cyan);
            border: 1px solid var(--pure-cyan);
            padding: 4px 8px;
            font-size: 0.65rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            max-width: 800px;
            margin: 0 auto;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #gameCanvas {
            background: #020206;
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 6px;
            display: block;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            width: 100%;
            max-width: 760px;
            height: 440px;
            touch-action: none;
        }

        .mobile-controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
            width: 100%;
            max-width: 760px;
            padding: 0 2px;
        }

        .ctrl-btn {
            background: rgba(0, 240, 255, 0.08);
            color: var(--pure-cyan);
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 12px;
            font-size: 0.72rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: background 0.1s;
        }

        .ctrl-btn:active {
            background: var(--pure-cyan);
            color: #000;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(3, 4, 8, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 6px;
        }

        .overlay.hidden { display: none; }
        .overlay h2 { font-size: 1.2rem; margin-bottom: 6px; color: var(--pure-pink); }
        .overlay p { font-size: 0.7rem; color: #b8c0d8; margin-bottom: 12px; padding: 0 15px; line-height: 1.3; }

        .btn {
            background: linear-gradient(135deg, var(--pure-cyan), #0077ff);
            color: #000000;
            border: 1px solid #ffffff;
            padding: 8px 18px;
            font-size: 0.75rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>⚡ 1. DISCO ELYSIUM : REVACHOL ENGINE ⚡</h1>
        <button class="menu-btn-top" onclick="resetGame()">🔄 SIFIRLA</button>
    </div>

    <div class="main-layout">
        <div class="canvas-container">
            <canvas id="gameCanvas" width="760" height="440"></canvas>
            
            <div id="menuOverlay" class="overlay">
                <h2>1. DISCO ELYSIUM (Revachol Echoes)</h2>
                <p>Aynaya bakıyorsun. Yüzün bir felaket. İç seslerin (Mantık, Otorite, İçgörü) kafanın içinde yankılanıyor. Android dokunmatik butonları kullanarak kararlarını ver.</p>
                <button class="btn" id="startBtn">OYUNA BAŞLA</button>
            </div>
        </div>

        <div class="mobile-controls">
            <button class="ctrl-btn" onclick="makeChoice(1)">🔸 [1] Aynaya öfkeyle bağır (Moral -1, Mantık +1)</button>
            <button class="ctrl-btn" onclick="makeChoice(2)">🔸 [2] Ceketinin ceplerini karıştır (Skor +25)</button>
            <button class="ctrl-btn" onclick="makeChoice(3)">🔸 [3] Yatağın altında ipucu ara (İçgörü +1)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const menuOverlay = document.getElementById("menuOverlay");
        const startBtn = document.getElementById("startBtn");

        let score = 0;
        let morale = 6;
        let logic = 4;
        let insight = 2;
        let dialogueText = "Aynadaki yansıman sana yabancı bakıyor. Whirling-in-Rags otel odasındasın.";

        function resetGame() {
            score = 0;
            morale = 6;
            logic = 4;
            insight = 2;
            dialogueText = "Oda sessiz. Hafızanı geri kazanmak için bir hamle yapmalısın.";
            menuOverlay.classList.remove("hidden");
        }

        function makeChoice(type) {
            menuOverlay.classList.add("hidden");
            if (type === 1) {
                morale = Math.max(0, morale - 1);
                logic += 1;
                score += 15;
                dialogueText = "Aynaya bağırdın! Camdaki çatlak yüzünü böldü. İç sesin: 'İyi iş dedektif.'";
            } else if (type === 2) {
                score += 25;
                dialogueText = "Cebinden boş bir şişe ve kırık bir madeni para çıktı. Hayatta kalıyorsun.";
            } else if (type === 3) {
                insight += 1;
                score += 20;
                dialogueText = "Yatağın altında eski bir defter buldun. Revachol'ün sokakları seni bekliyor.";
            }

            if (morale <= 0) {
                dialogueText = "MORAL ÇÖKÜŞÜ! Zihinsel olarak tükendin.";
            }
        }

        startBtn.onclick = () => {
            menuOverlay.classList.add("hidden");
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Arka Plan Izgarası
            ctx.strokeStyle = "rgba(0, 240, 255, 0.04)";
            for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            // Üst İstatistik Kutusu
            ctx.fillStyle = "#ffe600";
            ctx.font = "bold 12px 'Courier New'";
            ctx.textAlign = "left";
            ctx.fillText(`MORAL: ${morale}/6  |  MANTIK: ${logic}  |  İÇGÖRÜ: ${insight}`, 15, 25);
            ctx.textAlign = "right";
            ctx.fillText(`SKOR: ${score}`, canvas.width - 15, 25);

            // Ana Metin Konsolu Çerçevesi
            ctx.fillStyle = "#0d111c";
            ctx.fillRect(40, 50, canvas.width - 80, 280);
            ctx.strokeStyle = "#00f0ff";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(40, 50, canvas.width - 80, 280);

            // Başlık
            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 12px 'Courier New'";
            ctx.textAlign = "center";
            ctx.fillText("--- REVACHOL İÇ TRIBUNAL AKIŞI ---", canvas.width / 2, 85);

            // Diyalog Metni (Satırlara Bölme Yardımıyla)
            ctx.fillStyle = "#d0d8e8";
            ctx.font = "13px 'Courier New'";
            
            let words = dialogueText.split(" ");
            let line = "";
            let y = 135;
            
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + " ";
                let metrics = ctx.measureText(testLine);
                if (metrics.width > canvas.width - 120 && n > 0) {
                    ctx.fillText(line, canvas.width / 2, y);
                    line = words[n] + " ";
                    y += 24;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, canvas.width / 2, y);

            // Durum Notu
            ctx.fillStyle = "#ff007f";
            ctx.font = "11px 'Courier New'";
            ctx.fillText("Mobil dokunmatik butonları kullanarak kararlarını al.", canvas.width / 2, 305);
        }

        function mainLoop() {
            draw();
            requestAnimationFrame(mainLoop);
        }

        mainLoop();
    </script>
</body>
</html>
