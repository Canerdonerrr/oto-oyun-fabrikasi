<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeonBounce - 3D Multi-Camera Edition (HD 4X)</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #111111;
            --pure-cyan: #00ffff;
            --pure-pink: #ff00ff;
            --pure-yellow: #ffff00;
            --pure-green: #00ff00;
            --text-main: #ffffff;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 2px;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--pure-cyan);
            margin: 2px 0;
            letter-spacing: 2px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            max-width: 880px;
            margin: 0 auto 4px auto;
            padding: 6px 12px;
            background: var(--panel-bg);
            border: 2px solid var(--pure-cyan);
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .hud-item span { color: var(--pure-cyan); }
        .hud-item.lives span { color: var(--pure-pink); }
        .hud-item.high span { color: var(--pure-yellow); }
        .hud-item.level span { color: var(--pure-green); }

        .canvas-container {
            position: relative;
            display: inline-block;
            margin: 0 auto;
        }

        #webgl-container {
            width: 880px;
            height: 1040px;
            max-width: 95vw;
            max-height: 75vh;
            border: 2px solid var(--pure-cyan);
            border-radius: 4px;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 4px;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: var(--pure-pink);
        }

        .overlay p {
            font-size: 1rem;
            color: #cccccc;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 15px;
        }

        .btn {
            background: var(--pure-cyan);
            color: #000000;
            border: 2px solid #ffffff;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 2px;
        }

        .btn:active {
            background: #ffffff;
            color: var(--pure-cyan);
        }

        .btn-secondary {
            background: var(--panel-bg);
            color: var(--pure-cyan);
        }
    </style>
    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h1>NEON BOUNCE 3D (HD 4X)</h1>
    <div class="hud">
        <div class="hud-item">SKOR: <span id="scoreVal">0</span></div>
        <div class="hud-item high">REKOR: <span id="highVal">0</span></div>
        <div class="hud-item lives">CAN: <span id="livesVal">3</span></div>
        <div class="hud-item level">LVL: <span id="levelVal">1</span></div>
    </div>

    <div class="canvas-container">
        <div id="webgl-container"></div>
        
        <!-- Ana Menü -->
        <div id="menuOverlay" class="overlay">
            <h2>3D NEON BOUNCE</h2>
            <p>4 Kat Daha Büyük Çözünürlük ve Genişletilmiş Görüş Alanı!</p>
            
            <p style="margin-bottom:8px; color:var(--pure-cyan);">Kamera Modu:</p>
            <div class="btn-group">
                <button class="btn btn-secondary" id="cam1Btn" onclick="setCameraMode(1)">1. Klasik Üst</button>
                <button class="btn btn-secondary" id="cam2Btn" onclick="setCameraMode(2)">2. 3.Şahıs Takip</button>
                <button class="btn btn-secondary" id="cam3Btn" onclick="setCameraMode(3)">3. Sinematik</button>
            </div>

            <button class="btn" id="startBtn" style="margin-top:15px;">OYUNA BAŞLA</button>
        </div>

        <!-- Game Over -->
        <div id="gameOverOverlay" class="overlay hidden">
            <h2>OYUN BİTTİ</h2>
            <p id="finalScoreText">Skorun: 0</p>
            <button class="btn" id="restartBtn">TEKRAR DENE</button>
        </div>
    </div>

    <script>
        const scoreEl = document.getElementById("scoreVal");
        const highEl = document.getElementById("highVal");
        const livesEl = document.getElementById("livesVal");
        const levelEl = document.getElementById("levelVal");
        const menuOverlay = document.getElementById("menuOverlay");
        const gameOverOverlay = document.getElementById("gameOverOverlay");
        const finalScoreText = document.getElementById("finalScoreText");
        const startBtn = document.getElementById("startBtn");
        const restartBtn = document.getElementById("restartBtn");

        let gameState = "MENU";
        let score = 0;
        let highScore = localStorage.getItem("neon_3d_high_4x") || 0;
        let lives = 3;
        let level = 1;
        highEl.innerText = highScore;

        let cameraMode = 1;
        function setCameraMode(mode) {
            cameraMode = mode;
            document.getElementById("cam1Btn").style.borderColor = (mode === 1) ? "#ff00ff" : "#ffffff";
            document.getElementById("cam2Btn").style.borderColor = (mode === 2) ? "#ff00ff" : "#ffffff";
            document.getElementById("cam3Btn").style.borderColor = (mode === 3) ? "#ff00ff" : "#ffffff";
        }
        setCameraMode(1);

        // 4 Kat Daha Büyük Render Alanı (880x1040)
        const container = document.getElementById("webgl-container");
        const renderWidth = 880;
        const renderHeight = 1040;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(60, renderWidth / renderHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(renderWidth, renderHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00ffff, 2.0, 60);
        pointLight.position.set(0, 10, 12);
        scene.add(pointLight);

        const fieldWidth = 14;
        const fieldHeight = 18;

        // Raket
        const paddleGeo = new THREE.BoxGeometry(3.2, 0.6, 0.8);
        const paddleMat = new THREE.MeshPhongMaterial({ color: 0xff00ff, emissive: 0x330033 });
        const paddle = new THREE.Mesh(paddleGeo, paddleMat);
        paddle.position.set(0, -7.5, 0);
        scene.add(paddle);

        // Top
        const ballGeo = new THREE.SphereGeometry(0.35, 24, 24);
        const ballMat = new THREE.MeshPhongMaterial({ color: 0x00ffff, emissive: 0x00ffff });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        scene.add(ball);

        let ballVel = { x: 0, y: 0 };
        let brickMeshes = [];

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;
                if (type === "hit") {
                    osc.type = "square"; osc.frequency.setValueAtTime(220, now);
                    gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.04);
                } else if (type === "brick") {
                    osc.type = "square"; osc.frequency.setValueAtTime(440, now);
                    gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
                } else if (type === "gameover") {
                    osc.type = "sawtooth"; osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.3);
                    gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                }
                osc.start(now); osc.stop(now + 0.3);
            } catch(e) {}
        }

        function initLevel() {
            brickMeshes.forEach(b => scene.remove(b));
            brickMeshes = [];

            let rows = 4 + Math.min(level, 3);
            let cols = 6;
            let bWidth = 1.9;
            let bHeight = 0.6;
            let gap = 0.3;
            let startX = -((cols * (bWidth + gap)) / 2) + bWidth / 2;
            let startY = 6;

            const brickGeo = new THREE.BoxGeometry(bWidth, bHeight, 0.6);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let color = (r % 2 === 0) ? 0x00ffff : 0x9900ff;
                    if (r === 0) color = 0xff0000;

                    let mat = new THREE.MeshPhongMaterial({ color: color, emissive: color, emissiveIntensity: 0.3 });
                    let mesh = new THREE.Mesh(brickGeo, mat);

                    mesh.position.set(
                        startX + c * (bWidth + gap),
                        startY - r * (bHeight + gap),
                        0
                    );

                    mesh.userData = { health: 1, active: true };
                    scene.add(mesh);
                    brickMeshes.push(mesh);
                }
            }
        }

        function resetBallAndPaddle() {
            paddle.position.x = 0;
            ball.position.set(0, -6.5, 0);
            let speed = 0.08 + (level * 0.01);
            ballVel.x = speed * (Math.random() > 0.5 ? 1 : -1);
            ballVel.y = speed * 1.2;
        }

        function startGame() {
            initAudio();
            score = 0;
            lives = 3;
            level = 1;
            scoreEl.innerText = score;
            livesEl.innerText = lives;
            levelEl.innerText = level;
            menuOverlay.classList.add("hidden");
            gameOverOverlay.classList.add("hidden");
            initLevel();
            resetBallAndPaddle();
            gameState = "PLAYING";
        }

        function triggerGameOver() {
            gameState = "GAMEOVER";
            playSound("gameover");
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("neon_3d_high_4x", highScore);
                highEl.innerText = highScore;
            }
            finalScoreText.innerText = "Toplam Skorun: " + score;
            gameOverOverlay.classList.remove("hidden");
        }

        function handleMove(clientX) {
            let rect = renderer.domElement.getBoundingClientRect();
            let xNorm = ((clientX - rect.left) / rect.width) * 2 - 1;
            paddle.position.x = xNorm * (fieldWidth / 2 - 1.6);
            if (paddle.position.x < -fieldWidth/2 + 1.6) paddle.position.x = -fieldWidth/2 + 1.6;
            if (paddle.position.x > fieldWidth/2 - 1.6) paddle.position.x = fieldWidth/2 - 1.6;
        }

        window.addEventListener("mousemove", (e) => { if (gameState === "PLAYING") handleMove(e.clientX); });
        window.addEventListener("touchmove", (e) => {
            if (gameState === "PLAYING") {
                handleMove(e.touches[0].clientX);
                e.preventDefault();
            }
        }, { passive: false });

        startBtn.addEventListener("click", startGame);
        restartBtn.addEventListener("click", startGame);

        function updateCamera() {
            if (cameraMode === 1) {
                camera.position.set(0, -3, 15);
                camera.lookAt(0, 0, 0);
            } else if (cameraMode === 2) {
                camera.position.set(paddle.position.x * 0.5, -11, 5);
                camera.lookAt(0, 2, 0);
            } else if (cameraMode === 3) {
                camera.position.set(8, -10, 11);
                camera.lookAt(0, 0, 0);
            }
        }

        function update() {
            if (gameState !== "PLAYING") return;

            ball.position.x += ballVel.x;
            ball.position.y += ballVel.y;

            if (ball.position.x < -fieldWidth / 2 + 0.4) {
                ball.position.x = -fieldWidth / 2 + 0.4;
                ballVel.x = -ballVel.x; playSound("hit");
            }
            if (ball.position.x > fieldWidth / 2 - 0.4) {
                ball.position.x = fieldWidth / 2 - 0.4;
                ballVel.x = -ballVel.x; playSound("hit");
            }
            if (ball.position.y > fieldHeight / 2) {
                ball.position.y = fieldHeight / 2;
                ballVel.y = -ballVel.y; playSound("hit");
            }

            if (
                ball.position.y <= paddle.position.y + 0.4 &&
                ball.position.y >= paddle.position.y - 0.4 &&
                ball.position.x >= paddle.position.x - 1.8 &&
                ball.position.x <= paddle.position.x + 1.8
            ) {
                ballVel.y = -ballVel.y;
                let hitDist = ball.position.x - paddle.position.x;
                ballVel.x = hitDist * 0.08;
                playSound("hit");
            }

            let activeBricksCount = 0;
            brickMeshes.forEach(b => {
                if (!b.userData.active) return;
                activeBricksCount++;

                let bx = b.position.x;
                let by = b.position.y;
                if (
                    ball.position.x + 0.35 > bx - 0.95 &&
                    ball.position.x - 0.35 < bx + 0.95 &&
                    ball.position.y + 0.35 > by - 0.3 &&
                    ball.position.y - 0.35 < by + 0.3
                ) {
                    ballVel.y = -ballVel.y;
                    b.userData.active = false;
                    b.visible = false;
                    score += 25;
                    scoreEl.innerText = score;
                    playSound("brick");
                }
            });

            if (ball.position.y < -9) {
                lives--;
                livesEl.innerText = lives;
                if (lives <= 0) {
                    triggerGameOver();
                } else {
                    resetBallAndPaddle();
                }
            }

            if (activeBricksCount === 0) {
                score += 150;
                level++;
                levelEl.innerText = level;
                initLevel();
                resetBallAndPaddle();
            }

            updateCamera();
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        camera.position.set(0, -3, 15);
        camera.lookAt(0, 0, 0);
        animate();
    </script>
</body>
</html>
